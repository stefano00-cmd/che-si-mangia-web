[`Alici gratinate al forno~pesce~25~Facile~PG~Alici:C:600;Pangrattato:D:60;Prezzemolo:F:1:mazzo;Aglio:F:1:spicchi;Limoni:F:1:pz~Fai pulire le alici aperte a libro, senza testa e lisca.|Scalda il forno a 200 °C e disponile in una teglia unta, una accanto all’altra.|Coprile con pangrattato, prezzemolo e aglio tritati, sale, olio e scorza di limone.|Cuoci 12-15 minuti, finché la superficie è dorata.~Pesce azzurro: costa poco ed è ricchissimo di omega 3.`,
`Calamari ripieni~pesce~50~Media~PGU~Calamari:C:800;Pangrattato:D:80;Uova:L:1:pz;Prezzemolo:F:1:mazzo;Aglio:F:1:spicchi;Passata:D:300~Pulisci i calamari tenendo intere le sacche e trita i tentacoli.|Rosola i tentacoli con olio e aglio 3 minuti e uniscili a pangrattato, uovo, prezzemolo e sale.|Riempi le sacche per due terzi e chiudile con uno stecchino.|Rosolali in padella, aggiungi la passata e un po’ d’acqua, copri e cuoci 25 minuti a fuoco dolce.~Non riempirli troppo: in cottura si restringono e il ripieno uscirebbe.`,
`Baccalà in umido con patate~pesce~45~Facile~P~Baccalà dissalato:C:700;Patate:F:600;Passata:D:400;Olive:D:60;Capperi:D:20;Cipolle:F:1:pz~Fai appassire la cipolla affettata in olio per 5 minuti.|Aggiungi passata, olive, capperi e le patate a tocchi con un bicchiere d’acqua; cuoci coperto 15 minuti.|Adagia il baccalà a pezzi e cuoci altri 15 minuti senza mescolare.|Assaggia prima di salare: il baccalà è già sapido.~Compralo già dissalato: altrimenti va tenuto in acqua fredda 2-3 giorni.`,
`Sgombro alla mediterranea~pesce~25~Facile~P~Sgombro:C:800;Pomodorini:F:300;Olive:D:60;Capperi:D:20;Origano:D:2~Scalda il forno a 200 °C.|Disponi i filetti di sgombro in una teglia con i pomodorini a metà, olive e capperi.|Condisci con olio, sale e origano.|Cuoci 15-18 minuti.~Lo sgombro è economico e saporito: perfetto per chi inizia con il pesce azzurro.`,
`Bastoncini di merluzzo fatti in casa~pesce~25~Facile~PGU~Merluzzo:C:600;Uova:L:2:pz;Pangrattato:D:150;Limoni:F:1:pz~Taglia i filetti di merluzzo a bastoncini.|Passali nell’uovo sbattuto con un pizzico di sale e poi nel pangrattato.|Cuocili in forno a 200 °C per 15 minuti, o in padella con olio 2-3 minuti per lato.|Servi con spicchi di limone.~Piacciono ai bambini molto più di quelli surgelati.`,
`Gamberi e zucchine in padella~pesce~20~Facile~P~Gamberi:C:500;Zucchine:F:400;Aglio:F:1:spicchi;Prezzemolo:F:1:mazzo;Limoni:F:1:pz~Taglia le zucchine a julienne o a rondelle sottili.|Saltale in padella con olio e aglio per 6 minuti a fuoco vivo.|Aggiungi i gamberi sgusciati e cuoci 2-3 minuti.|Completa con prezzemolo, scorza di limone e sale.~Ottimo anche per condire la pasta.`,
`Trota salmonata al cartoccio~pesce~30~Facile~P~Trota salmonata:C:800;Limoni:F:1:pz;Prezzemolo:F:1:mazzo;Zucchine:F:300~Scalda il forno a 200 °C.|Disponi i filetti di trota su carta forno con zucchine a rondelle sottili, fette di limone, prezzemolo, olio e sale.|Chiudi bene i cartocci.|Cuoci 18-20 minuti.~Pesce di lago, delicato e con poche spine.`,
`Polpette di tonno~pesce~30~Facile~PGUL~Tonno:D:3:lattine;Patate:F:300;Uova:L:1:pz;Parmigiano:L:40;Pangrattato:D:80;Prezzemolo:F:1:mazzo~Lessa le patate e schiacciale.|Unisci tonno sgocciolato, uovo, parmigiano, prezzemolo e metà del pangrattato.|Forma delle polpette e passale nel pangrattato rimasto.|Cuocile in forno a 200 °C per 20 minuti o in padella con olio 3 minuti per lato.~Si preparano con ingredienti di dispensa: ottime per svuotare la credenza.`,
`Spaghetti alle cozze~pasta~30~Facile~GP~Spaghetti:D:320;Cozze:C:1000;Pomodorini:F:250;Aglio:F:2:spicchi;Prezzemolo:F:1:mazzo~Pulisci le cozze e aprile in una pentola coperta con olio e aglio a fuoco vivo (5 minuti); sgusciane metà e filtra il liquido.|In padella rosola i pomodorini a metà con olio per 5 minuti e aggiungi il liquido delle cozze.|Cuoci gli spaghetti 2 minuti meno del tempo indicato e finisci la cottura in padella.|Unisci le cozze e il prezzemolo e servi.~Un pizzico di peperoncino ci sta benissimo.`,
`Paccheri pesce spada e melanzane~pasta~35~Media~GP~Paccheri:D:320;Pesce spada:C:300;Melanzane:F:1:pz;Pomodorini:F:250;Menta:F:1:mazzo;Aglio:F:1:spicchi~Taglia la melanzana a dadini e friggila o rosolala in abbondante olio finché è dorata; scolala.|In padella rosola aglio e pomodorini 5 minuti, poi aggiungi il pesce spada a dadini e cuoci 3 minuti.|Cuoci i paccheri al dente e saltali nel sugo con le melanzane.|Completa con menta fresca spezzata.~È un piatto siciliano estivo: la menta fa la differenza.`,
`Pesce spada al salmoriglio~pesce~20~Facile~P~Pesce spada:C:700;Limoni:F:2:pz;Origano:D:3;Prezzemolo:F:1:mazzo;Aglio:F:1:spicchi~Prepara il salmoriglio: sbatti olio, succo di limone, un po’ d’acqua calda, origano, prezzemolo e aglio tritati e sale.|Cuoci le fette di pesce spada su piastra ben calda 2-3 minuti per lato.|Irrorale subito con il salmoriglio e servi.~Il salmoriglio è la salsa calabrese e siciliana per tutto il pesce alla griglia.`,
`Passato di verdure con crostini~legumi~40~Facile~G~Patate:F:300;Carote:F:2:pz;Zucchine:F:300;Porri:F:1:pz;Sedano:F:1:pz;Pane:P:4:pz~Taglia tutte le verdure a pezzi.|Mettile in pentola con 1,2 litri d’acqua e un pizzico di sale e cuoci 30 minuti.|Frulla fino a una crema liscia, regolando la densità con l’acqua di cottura.|Servi con crostini tostati, olio a crudo e parmigiano a piacere.~Piace anche ai più piccoli: è la base delle prime pappe.`,
`Crespelle prosciutto e formaggio~pasta~50~Media~GUL~Farina:D:150;Uova:L:3:pz;Latte:L:350:ml;Prosciutto cotto:C:150;Fontina:L:150;Besciamella:L:400:ml;Parmigiano:L:40~Frulla farina, uova, latte e un pizzico di sale e lascia riposare la pastella 20 minuti.|Cuoci le crespelle in una padellina unta, un mestolino alla volta, 1 minuto per lato.|Farcisci ogni crespella con prosciutto, fontina e un cucchiaio di besciamella e piegala in quattro.|Disponile in una pirofila, coprile con la besciamella rimasta e il parmigiano.|Gratina in forno a 200 °C per 15 minuti.~Si possono preparare in anticipo e infornare all’ultimo.`

[`Spaghetti al limone~pasta~15~Facile~GL~Spaghetti:D:320;Limoni:F:2:pz;Burro:L:50;Parmigiano:L:60~Lava bene i limoni e grattugia la scorza; spremi il succo di uno.|Cuoci gli spaghetti in acqua salata.|In una padella larga sciogli il burro con la scorza e metà del succo a fuoco dolce.|Scola gli spaghetti al dente tenendo un mestolo d’acqua di cottura e saltali nella padella.|Spegni e manteca con parmigiano, acqua di cottura e pepe, finché è cremoso.~Ricetta della Costiera Amalfitana: servono limoni non trattati e profumati.`,
`Pennette alla vodka~pasta~20~Facile~GL~Penne:D:320;Passata:D:250;Panna:L:150:ml;Pancetta:C:100;Cipolle:F:1:pz;Vodka:D:40:ml;Parmigiano:L:40~Rosola cipolla tritata e pancetta a dadini con un filo d’olio per 5 minuti.|Sfuma con la vodka e lascia evaporare 1 minuto a fuoco vivo.|Aggiungi la passata e cuoci 8 minuti, poi la panna per 2 minuti.|Cuoci le penne al dente, saltale nel sugo e completa con parmigiano.~L’alcol evapora in cottura: resta solo il profumo, va bene anche per i bambini.`,
`Tagliatelle ai funghi porcini~pasta~30~Media~GUL~Tagliatelle:D:320;Funghi porcini:F:400;Aglio:F:1:spicchi;Prezzemolo:F:1:mazzo;Burro:L:30;Parmigiano:L:40~Pulisci i porcini con un panno umido e un coltellino e tagliali a fettine.|Scalda olio e aglio, aggiungi i funghi e cuocili a fuoco vivace 8 minuti; sala e unisci il prezzemolo.|Cuoci le tagliatelle 1 minuto meno del tempo indicato.|Saltale nei funghi con burro e un mestolo d’acqua di cottura; servi con parmigiano.~Fuori stagione usa 40 g di porcini secchi ammollati più 300 g di champignon.`,
`Pappardelle al ragù di salsiccia~pasta~40~Facile~GUL~Pappardelle:D:320;Salsiccia:C:350;Passata:D:400;Cipolle:F:1:pz;Vino rosso:D:100:ml;Parmigiano:L:50~Trita la cipolla e falla appassire in olio per 5 minuti.|Aggiungi la salsiccia sgranata e rosolala 6 minuti; sfuma con il vino.|Unisci la passata, sala poco e cuoci a fuoco dolce 25 minuti.|Cuoci le pappardelle al dente e condiscile con il ragù e il parmigiano.~La salsiccia è già saporita: assaggia prima di salare.`,
`Spaghetti alla carrettiera~pasta~15~Facile~GL~Spaghetti:D:320;Pomodori:F:500;Aglio:F:2:spicchi;Basilico:F:1:mazzo;Pecorino:L:60;Peperoncino:F:1:pz~Taglia i pomodori a dadini e mettili in una ciotola grande con aglio tritato, basilico, peperoncino, olio e sale.|Lascia insaporire mentre cuoci gli spaghetti al dente.|Scola la pasta e saltala direttamente nella ciotola con il condimento crudo.|Completa con pecorino grattugiato.~È la pasta dei carrettieri siciliani: tutto a crudo, pronta in un quarto d’ora.`,
`Pasta e broccoli~legumi~30~Facile~GL~Pasta mista:D:250;Broccoli:F:600;Aglio:F:1:spicchi;Peperoncino:F:1:pz;Pecorino:L:40~Dividi i broccoli in cimette e taglia a pezzetti il gambo pelato.|In pentola scalda olio, aglio e peperoncino, aggiungi i broccoli e rosolali 3 minuti.|Copri con 1 litro d’acqua calda salata e cuoci 10 minuti, schiacciando qualche cimetta.|Unisci la pasta e cuocila nella minestra, mescolando, finché è cremosa.|Servi con pecorino e un filo d’olio.~Alla napoletana si cuoce tutto nella stessa pentola: viene densa, quasi un risotto.`,
`Pasta e zucca~legumi~35~Facile~GL~Pasta mista:D:250;Zucca:F:600;Cipolle:F:1:pz;Rosmarino:F:1:mazzo;Parmigiano:L:40~Taglia la zucca a cubetti e la cipolla a fettine.|Fai appassire la cipolla in olio con il rosmarino, aggiungi la zucca e cuoci 5 minuti.|Copri con 800 ml d’acqua calda salata e cuoci 15 minuti, finché la zucca si disfa.|Unisci la pasta e cuocila mescolando spesso; completa con parmigiano e pepe.~Un pezzetto di provola a fine cottura la rende filante.`,
`Spaghetti alla chitarra con pallottine~pasta~50~Media~GUL~Spaghetti alla chitarra:D:320;Macinato di manzo:C:250;Uova:L:1:pz;Pecorino:L:60;Passata:D:600;Cipolle:F:1:pz~Impasta il macinato con l’uovo, metà del pecorino e un pizzico di sale e forma polpettine piccolissime, grandi come una nocciola.|Prepara il sugo: cipolla tritata in olio, poi passata e sale; cuoci 15 minuti.|Aggiungi le pallottine al sugo e cuoci altri 15 minuti senza mescolare troppo.|Cuoci gli spaghetti alla chitarra e condiscili con il sugo e il pecorino rimasto.~È il piatto della festa in Abruzzo: più sono piccole le polpettine, più è autentico.`,
`Strozzapreti salsiccia e piselli~pasta~25~Facile~GL~Strozzapreti:D:320;Salsiccia:C:250;Piselli:S:250;Cipolle:F:1:pz;Panna:L:100:ml;Parmigiano:L:40~Rosola la cipolla tritata con un filo d’olio, poi la salsiccia sgranata per 5 minuti.|Aggiungi i piselli e un mestolo d’acqua e cuoci 10 minuti.|Versa la panna e lascia addensare 2 minuti.|Cuoci gli strozzapreti al dente e saltali nel sugo con il parmigiano.~È un classico delle trattorie romagnole.`,
`Pasta, fagioli e cozze~legumi~40~Media~GP~Pasta mista:D:250;Fagioli:D:2:lattine;Cozze:C:1000;Pomodorini:F:200;Aglio:F:2:spicchi;Prezzemolo:F:1:mazzo;Peperoncino:F:1:pz~Apri le cozze in una pentola coperta a fuoco vivo, sgusciale e filtra il liquido.|In pentola scalda olio, aglio e peperoncino, aggiungi i pomodorini e cuoci 5 minuti.|Unisci i fagioli, il liquido delle cozze e 600 ml d’acqua e porta a bollore.|Cuoci la pasta nella minestra, mescolando, e negli ultimi 2 minuti aggiungi le cozze.|Completa con prezzemolo e olio a crudo.~Un classico napoletano: densa, profumata di mare.`,
`Linguine al pesto di pistacchi~pasta~15~Facile~GLN~Linguine:D:320;Pistacchi:D:100;Parmigiano:L:40;Basilico:F:1:mazzo;Pomodorini:F:200~Frulla i pistacchi con parmigiano, basilico, 80 ml d’olio e un mestolino d’acqua fredda fino a una crema.|Cuoci le linguine in acqua salata.|Taglia i pomodorini a metà.|Scola la pasta e condiscila fuori dal fuoco con il pesto, allungando con acqua di cottura; completa con i pomodorini.~Con i pistacchi di Bronte il sapore è inconfondibile.`,
`Gnocchi con speck e zucchine~pasta~20~Facile~GL~Gnocchi:D:600;Speck:C:120;Zucchine:F:300;Panna:L:100:ml;Parmigiano:L:40~Taglia lo speck a listarelle e le zucchine a dadini.|Rosola lo speck in padella senza olio per 2 minuti, poi aggiungi le zucchine e cuoci 8 minuti.|Versa la panna e lascia addensare 1 minuto.|Lessa gli gnocchi finché salgono a galla e saltali nel condimento con il parmigiano.~Senza panna è ancora più leggero: usa un mestolo d’acqua degli gnocchi.`,
`Spaghetti con zucchine e gamberi~pasta~20~Facile~GP~Spaghetti:D:320;Gamberi:C:300;Zucchine:F:400;Aglio:F:1:spicchi;Prezzemolo:F:1:mazzo;Limoni:F:1:pz~Taglia le zucchine a julienne e sguscia i gamberi.|Rosola le zucchine con olio e aglio per 6 minuti a fuoco vivo.|Aggiungi i gamberi e cuocili 2 minuti.|Cuoci gli spaghetti al dente e saltali nel condimento con acqua di cottura, prezzemolo e scorza di limone.~Pronta in venti minuti: perfetta per una cena veloce.`,
`Risotto alla parmigiana~riso~25~Facile~L~Riso:D:320;Burro:L:60;Parmigiano:L:100;Cipolle:F:1:pz;Brodo di carne:D:1:l~Fai appassire la cipolla tritata in metà del burro per 4 minuti.|Aggiungi il riso e tostalo 2 minuti.|Cuoci 16-18 minuti aggiungendo il brodo caldo un mestolo alla volta.|Spegni e manteca con il burro rimasto e abbondante parmigiano; lascia riposare 2 minuti.~È il risotto base della tradizione: semplice, ma il brodo deve essere buono.`,
`Risotto al limone~riso~25~Facile~L~Riso:D:320;Limoni:F:2:pz;Burro:L:50;Parmigiano:L:60;Cipolle:F:1:pz;Brodo vegetale:D:1:l~Grattugia la scorza dei limoni e spremi il succo di uno.|Fai appassire la cipolla tritata in metà del burro, aggiungi il riso e tostalo 2 minuti.|Cuoci 16-18 minuti con il brodo caldo, un mestolo alla volta.|Spegni e manteca con burro, parmigiano, scorza e un cucchiaio di succo.~Il succo va aggiunto solo alla fine: cotto diventa amaro.`,
`Risotto ai carciofi~riso~40~Media~L~Riso:D:320;Carciofi:F:4:pz;Cipolle:F:1:pz;Vino bianco:D:80:ml;Brodo vegetale:D:1:l;Parmigiano:L:60;Burro:L:30;Limoni:F:1:pz~Pulisci i carciofi, tagliali a spicchi sottili e tienili in acqua e limone.|Fai appassire la cipolla in olio, aggiungi i carciofi scolati e cuocili 8 minuti con un mestolo di brodo.|Unisci il riso, tostalo 2 minuti e sfuma con il vino.|Cuoci 16-18 minuti con il brodo caldo, un mestolo alla volta.|Manteca con burro e parmigiano.~Tieni da parte qualche spicchio di carciofo rosolato per decorare.`,
`Risotto gorgonzola e noci~riso~25~Facile~LN~Riso:D:320;Gorgonzola:L:150;Noci:D:50;Cipolle:F:1:pz;Brodo vegetale:D:1:l;Burro:L:20~Fai appassire la cipolla tritata con il burro, aggiungi il riso e tostalo 2 minuti.|Cuoci 16-18 minuti con il brodo caldo, un mestolo alla volta.|Spegni e manteca con il gorgonzola a pezzetti finché si scioglie.|Servi con le noci tritate e tostate.~Poco sale nel brodo: il gorgonzola è già saporito.`,
`Arancini al ragù~riso~100~Media~GUL~Riso:D:400;Zafferano:D:1:bustina;Macinato misto:C:250;Passata:D:250;Piselli:S:150;Caciocavallo:L:150;Uova:L:2:pz;Pangrattato:D:200;Farina:D:80;Burro:L:30~Lessa il riso in acqua salata con lo zafferano per 15 minuti, finché asciuga; condiscilo con burro e lascialo raffreddare completamente.|Prepara un ragù denso con il macinato, la passata e i piselli (30 minuti).|Con le mani umide prendi una manciata di riso, fai un incavo, metti ragù e un cubetto di caciocavallo e chiudi a palla.|Passa gli arancini in una pastella di farina, uova e acqua, poi nel pangrattato.|Friggili in olio caldo a 170 °C per 5 minuti, oppure cuocili in forno a 200 °C per 25 minuti.~Il riso deve essere freddo e asciutto, altrimenti non si compatta.`,
`Polenta con salsiccia al sugo~riso~50~Facile~L~Farina di mais:D:300;Salsiccia:C:500;Passata:D:500;Cipolle:F:1:pz;Parmigiano:L:40~Rosola la salsiccia a pezzi con la cipolla affettata per 6 minuti.|Aggiungi la passata e sale e cuoci 30 minuti a fuoco dolce.|Intanto porta a bollore 1,2 litri d’acqua salata, versa la farina a pioggia e cuoci 40 minuti mescolando (con quella istantanea bastano 8 minuti).|Servi la polenta morbida nei piatti con la salsiccia e il suo sugo e una spolverata di parmigiano.~La polenta avanzata, il giorno dopo, è buonissima abbrustolita.`,
`Pollo alla diavola~carne~50~Facile~~Pollo intero aperto:C:1200;Limoni:F:1:pz;Peperoncino:F:1:pz;Rosmarino:F:1:mazzo;Aglio:F:2:spicchi~Fatti aprire il pollo a libro dal macellaio e battilo per appiattirlo.|Marinalo 30 minuti con olio, succo di limone, peperoncino, aglio, rosmarino, sale e pepe.|Scalda il forno a 220 °C e cuoci il pollo con la pelle verso l’alto per 40-45 minuti.|Negli ultimi 5 minuti accendi il grill per renderlo croccante.~Anche sulla griglia: schiacciato sotto un peso, 15 minuti per lato.`,
`Pollo in umido con patate~carne~60~Facile~~Pollo a pezzi:C:1200;Patate:F:600;Passata:D:300;Cipolle:F:1:pz;Rosmarino:F:1:mazzo;Vino bianco:D:100:ml~Rosola il pollo in una casseruola con olio per 10 minuti, finché è dorato.|Aggiungi la cipolla affettata e il rosmarino e sfuma con il vino.|Unisci la passata, un bicchiere d’acqua e sale; copri e cuoci 20 minuti.|Aggiungi le patate a tocchi e cuoci altri 25 minuti, finché sono morbide.~È il pollo della domenica di campagna: ancora più buono il giorno dopo.`,
`Involtini alla romana~carne~50~Media~~Fettine di vitello:C:600;Prosciutto crudo:C:100;Carote:F:2:pz;Sedano:F:2:pz;Passata:D:400;Vino bianco:D:80:ml~Batti le fettine e su ognuna metti una fetta di crudo e un bastoncino di carota e di sedano.|Arrotolale e chiudile con uno stecchino.|Rosolale in padella con olio su tutti i lati e sfuma con il vino.|Aggiungi la passata e un po’ d’acqua, sala, copri e cuoci a fuoco dolce 30 minuti.~Il sugo è ottimo per condire la pasta: un primo e un secondo in un colpo solo.`,
`Lonza al latte~carne~90~Media~L~Lonza di maiale:C:900;Latte:L:750:ml;Burro:L:30;Rosmarino:F:1:mazzo;Aglio:F:1:spicchi~Lega la lonza con lo spago e rosolala in una casseruola con burro, olio, aglio e rosmarino su tutti i lati.|Versa il latte caldo fino a coprire per metà, sala e copri.|Cuoci a fuoco dolce 70 minuti, girando ogni tanto: il latte formerà dei grumetti dorati.|Togli la carne e frulla il fondo per ottenere una salsa liscia.|Affetta la lonza e servila con la salsa.~È un classico emiliano: la carne resta tenerissima.`,
`Salsiccia e friarielli~carne~30~Facile~~Salsiccia:C:600;Cime di rapa:F:800;Aglio:F:2:spicchi;Peperoncino:F:1:pz~Pulisci le cime di rapa tenendo foglie tenere e infiorescenze.|Scalda olio, aglio e peperoncino in una padella larga, aggiungi le cime e cuocile coperte 10 minuti, mescolando.|In un’altra padella rosola le salsicce bucherellate per 12-15 minuti.|Unisci le salsicce alle cime e lascia insaporire 3 minuti.~A Napoli si usano i friarielli: se li trovi, sono perfetti.`,
`Cotechino e lenticchie~carne~60~Facile~~Cotechino precotto:C:500;Lenticchie:D:2:lattine;Cipolle:F:1:pz;Carote:F:1:pz;Sedano:F:1:pz;Passata:D:150~Cuoci il cotechino nella sua confezione in acqua bollente per il tempo indicato (di solito 20-30 minuti).|Intanto trita cipolla, carota e sedano e falli appassire in olio per 8 minuti.|Aggiungi le lenticchie, la passata e un bicchiere d’acqua e cuoci 15 minuti.|Affetta il cotechino e servilo sulle lenticchie.~Le lenticchie a Capodanno portano fortuna, ma sono buone tutto l’inverno.`,
`Polpette di pollo al limone~carne~30~Facile~GUL~Macinato di pollo:C:500;Uova:L:1:pz;Pangrattato:D:60;Parmigiano:L:40;Limoni:F:1:pz;Farina:D:30~Impasta il macinato con uovo, pangrattato, parmigiano, scorza di limone, sale e pepe.|Forma polpette piccole e infarinale leggermente.|Rosolale in padella con olio per 8 minuti, girandole.|Aggiungi il succo di limone e mezzo bicchiere d’acqua e cuoci 5 minuti finché si forma una cremina.~Piacciono molto ai bambini: servile con purè o riso.`,
`Spiedini misti di carne~carne~30~Facile~~Petto di pollo:C:300;Salsiccia:C:300;Lonza di maiale:C:300;Peperoni:F:1:pz;Cipolle rosse:F:1:pz;Rosmarino:F:1:mazzo~Taglia carni, peperone e cipolla a pezzi della stessa misura.|Infilzali alternandoli sugli spiedini.|Spennella con olio e rosmarino.|Cuoci sulla griglia o in una piastra ben calda 12-15 minuti, girando spesso; sala alla fine.~Ottimi anche in forno a 220 °C per 20 minuti.`,
`Bollito con salsa verde~carne~180~Media~GUP~Manzo per bollito:C:1200;Carote:F:2:pz;Sedano:F:2:pz;Cipolle:F:1:pz;Prezzemolo:F:2:mazzo;Capperi:D:20;Acciughe:C:20;Uova:L:1:pz;Pane:P:1:pz~Porta a bollore abbondante acqua con carote, sedano, cipolla e sale; immergi la carne.|Cuoci a fuoco bassissimo per 2 ore e mezza, schiumando ogni tanto.|Per la salsa verde trita prezzemolo, capperi, acciughe, un uovo sodo e la mollica bagnata nell’aceto; unisci olio fino a una salsa densa.|Affetta il bollito e servilo con le verdure e la salsa verde.~Il brodo avanzato è perfetto per tortellini o risotti.`,
`Petto di pollo alla pizzaiola~carne~20~Facile~L~Petto di pollo:C:600;Passata:D:300;Mozzarella:L:150;Origano:D:2;Aglio:F:1:spicchi~Taglia il petto a fette e battile leggermente.|Rosolale in padella con olio e aglio 2 minuti per lato.|Aggiungi passata, sale e origano e cuoci 8 minuti.|Metti sopra la mozzarella a fette, copri e cuoci 2 minuti finché fila.~Una cena pronta in venti minuti che piace a tutti.`,
`Zucchine ripiene di carne~carne~50~Facile~GUL~Zucchine:F:6:pz;Macinato misto:C:300;Uova:L:1:pz;Parmigiano:L:50;Pangrattato:D:40;Passata:D:200~Scalda il forno a 190 °C.|Taglia le zucchine a metà per il lungo e svuotale con un cucchiaino; trita la polpa.|Mescola macinato, polpa, uovo, parmigiano, pangrattato, sale e pepe e riempi le zucchine.|Disponile in una teglia con la passata sul fondo e un filo d’olio sopra.|Cuoci 35 minuti, finché sono dorate.~Con le zucchine tonde diventano ancora più scenografiche.`,
`Filetti di orata con pomodorini~pesce~20~Facile~P~Filetti di orata:C:600;Pomodorini:F:300;Olive:D:50;Aglio:F:1:spicchi;Basilico:F:1:mazzo~Scalda olio e aglio in padella, aggiungi i pomodorini a metà e le olive e cuoci 5 minuti.|Adagia i filetti dalla parte della pelle e cuoci 4 minuti.|Copri e cuoci altri 3 minuti, finché la carne è bianca.|Completa con basilico e un filo d’olio a crudo.~Se sono surgelati, scongelali in frigo e asciugali bene.`,
`Merluzzo alla pizzaiola~pesce~20~Facile~P~Merluzzo:C:600;Passata:D:300;Capperi:D:20;Origano:D:2;Aglio:F:1:spicchi~Scalda olio e aglio, aggiungi passata, capperi, origano e sale e cuoci 8 minuti.|Adagia i filetti di merluzzo nel sugo.|Copri e cuoci a fuoco dolce 8-10 minuti, senza girarli.|Servi con il sugo e pane per la scarpetta.~Va benissimo anche il merluzzo surgelato.`,
`Cozze gratinate~pesce~35~Media~PGL~Cozze:C:1000;Pangrattato:D:80;Pecorino:L:30;Prezzemolo:F:1:mazzo;Aglio:F:1:spicchi~Pulisci le cozze e aprile in una pentola coperta a fuoco vivo; tieni il guscio con il frutto.|Scalda il forno a 220 °C con il grill.|Mescola pangrattato, pecorino, prezzemolo e aglio tritati, olio e un po’ dell’acqua delle cozze filtrata.|Riempi le mezze valve con il composto e disponile in teglia.|Gratina 8-10 minuti, finché sono dorate.~Sono l’antipasto pugliese per eccellenza: ottime anche come secondo.`,
`Calamari alla griglia~pesce~15~Facile~P~Calamari:C:800;Limoni:F:1:pz;Prezzemolo:F:1:mazzo;Aglio:F:1:spicchi~Fatti pulire i calamari e incidi leggermente il corpo a rombi.|Scalda bene una piastra o una griglia.|Cuoci i calamari 2-3 minuti per lato: devono restare morbidi.|Condisci con olio, limone, prezzemolo e aglio tritati e sale.~Più li cuoci, più diventano duri: pochi minuti a fuoco alto.`,
`Sarde a beccafico~pesce~45~Media~PGNL~Sarde:C:800;Pangrattato:D:100;Pinoli:D:30;Uvetta:D:30;Pecorino:L:30;Arance:F:1:pz;Alloro:D:1:pz~Fai pulire le sarde aperte a libro, senza testa e lisca.|Tosta il pangrattato in padella con un filo d’olio e mescolalo con pinoli, uvetta ammollata, pecorino, prezzemolo e un po’ di succo d’arancia.|Metti un cucchiaio di ripieno su ogni sarda e arrotolala verso la coda.|Disponile in teglia con foglie di alloro tra l’una e l’altra e un filo d’olio.|Cuoci in forno a 180 °C per 20 minuti.~Il nome viene dai beccafichi, gli uccellini che ricordano con la coda all’insù.`,
`Tonno in agrodolce con cipolle~pesce~25~Facile~PG~Tonno fresco:C:600;Cipolle rosse:F:3:pz;Aceto:D:60:ml;Zucchero:D:20;Farina:D:30~Affetta sottili le cipolle e falle appassire in olio per 15 minuti a fuoco dolce.|Aggiungi aceto e zucchero e lascia evaporare 2 minuti: la cipolla diventa agrodolce.|Infarina i tranci di tonno e scottali in un’altra padella 1-2 minuti per lato.|Servi il tonno coperto dalle cipolle.~Piatto siciliano: buono anche a temperatura ambiente.`,
`Branzino in crosta di sale~pesce~45~Facile~P~Branzino:C:1200;Sale grosso:D:2000;Limoni:F:1:pz;Rosmarino:F:1:mazzo~Scalda il forno a 200 °C.|Riempi la pancia dei branzini puliti (con le squame) con limone e rosmarino.|Fai uno strato di sale grosso inumidito con poca acqua in una teglia, adagia il pesce e coprilo completamente con altro sale.|Cuoci 35 minuti.|Rompi la crosta a tavola, togli la pelle e servi i filetti con un filo d’olio.~Il sale non entra nella carne: il pesce resta umido e delicato.`,
`Peperonata con patate~legumi~45~Facile~~Peperoni:F:4:pz;Patate:F:500;Cipolle:F:1:pz;Passata:D:200;Basilico:F:1:mazzo~Taglia i peperoni a falde, le patate a tocchi e la cipolla a fettine.|Fai appassire la cipolla in olio, aggiungi le patate e cuoci 10 minuti.|Unisci i peperoni, la passata e sale; copri e cuoci 25 minuti a fuoco dolce.|Completa con basilico; servi calda o tiepida con pane.~Un cucchiaio di aceto a fine cottura rende i peperoni più digeribili.`,
`Parmigiana di zucchine~legumi~60~Media~L~Zucchine:F:1000;Passata:D:500;Mozzarella:L:250;Parmigiano:L:80;Basilico:F:1:mazzo~Taglia le zucchine a fette sottili per il lungo e grigliale 2 minuti per lato.|Prepara un sugo con olio, passata, sale e basilico (10 minuti).|In una pirofila alterna sugo, zucchine, mozzarella a cubetti e parmigiano, in 3 strati.|Cuoci in forno a 190 °C per 30 minuti e lascia riposare 10 minuti.~Più leggera della parmigiana di melanzane e pronta in un’ora.`,
`Gattò di patate~legumi~70~Media~GUL~Patate:F:1000;Uova:L:2:pz;Parmigiano:L:60;Prosciutto cotto:C:150;Provola:L:200;Burro:L:40;Pangrattato:D:40~Lessa le patate con la buccia per 30 minuti, sbucciale e schiacciale.|Unisci uova, parmigiano, burro, sale e pepe.|Imburra una teglia e cospargila di pangrattato; stendi metà delle patate.|Distribuisci prosciutto e provola a cubetti e copri con le patate rimaste; spolvera di pangrattato e fiocchetti di burro.|Cuoci in forno a 200 °C per 30 minuti e lascia riposare 15 minuti prima di tagliare.~È il gattò napoletano: buono anche tiepido o il giorno dopo.`,
`Zuppa di porri e patate~legumi~35~Facile~GL~Porri:F:3:pz;Patate:F:600;Brodo vegetale:D:1:l;Burro:L:20;Pane:P:4:pz;Parmigiano:L:30~Affetta i porri a rondelle e falli appassire nel burro per 8 minuti.|Aggiungi le patate a cubetti e il brodo e cuoci 20 minuti.|Frulla metà della zuppa e rimettila in pentola per renderla cremosa.|Servi con crostini di pane tostato e parmigiano.~Un piatto caldo e delicato, perfetto per le sere d’inverno.`,
`Uova in camicia con asparagi~uova~20~Facile~UL~Uova:L:4:pz;Asparagi:F:600;Parmigiano:L:40;Burro:L:20;Aceto:D:20:ml~Lessa gli asparagi in acqua salata per 6-8 minuti e disponili nei piatti.|Porta a leggero bollore una pentola d’acqua con l’aceto.|Rompi un uovo alla volta in una tazzina, crea un vortice nell’acqua e versalo al centro: cuoci 3 minuti.|Scola le uova con una schiumarola e adagiale sugli asparagi.|Completa con burro fuso, parmigiano e pepe.~Le uova devono essere freschissime: l’albume resta compatto.`,
`Frittata di ricotta ed erbe~uova~20~Facile~UL~Uova:L:6:pz;Ricotta:L:200;Parmigiano:L:40;Prezzemolo:F:1:mazzo;Basilico:F:1:mazzo~Sbatti le uova con parmigiano, erbe tritate, sale e pepe.|Versa in una padella antiaderente con un filo d’olio.|Distribuisci la ricotta a cucchiaiate sopra le uova.|Cuoci coperto a fuoco basso 8 minuti, gira con un piatto e cuoci altri 3 minuti.~La ricotta resta morbida dentro: ottima anche fredda in un panino.`,
`Pizza bianca con patate e rosmarino~pizza~35~Facile~G~Impasto per pizza:P:1000;Patate:F:500;Rosmarino:F:1:mazzo;Sale grosso:D:10~Scalda il forno al massimo (250 °C).|Affetta le patate sottilissime, quasi trasparenti, e condiscile con olio, sale e rosmarino.|Stendi l’impasto in due teglie unte.|Distribuisci le patate in un solo strato, un filo d’olio e qualche grano di sale grosso.|Cuoci 18-20 minuti, finché le patate sono dorate.~Una mandolina rende le patate sottili e uguali: cuociono insieme alla pasta.`,
`Focaccia di Recco~pizza~40~Media~GL~Farina:D:300;Crescenza:L:400~Impasta farina, 160 ml d’acqua, 3 cucchiai d’olio e un pizzico di sale per 10 minuti e lascia riposare 30 minuti coperto.|Scalda il forno al massimo (250 °C) e ungi una teglia grande.|Dividi l’impasto in due e stendi la prima metà sottilissima, quasi trasparente, sulla teglia.|Distribuisci la crescenza a cucchiaiate e copri con la seconda sfoglia, sottilissima anch’essa.|Pizzica la superficie per fare dei buchi, condisci con olio e sale e cuoci 10-12 minuti.~Non serve lievito: il segreto è stendere la pasta sottilissima.`,
`Sfincione palermitano~pizza~150~Media~GLP~Farina:D:500;Lievito di birra:D:1:bustina;Passata:D:400;Cipolle:F:2:pz;Acciughe:C:40;Caciocavallo:L:120;Pangrattato:D:60;Origano:D:2~Impasta farina, 320 ml d’acqua tiepida, lievito, 10 g di sale e 3 cucchiai d’olio; lascia lievitare un’ora e mezza.|Fai appassire le cipolle affettate in olio, aggiungi passata e acciughe e cuoci 20 minuti.|Stendi l’impasto in una teglia oliata, alto e soffice, e lascia lievitare altri 30 minuti.|Distribuisci caciocavallo a pezzetti, il sugo, pangrattato tostato e origano.|Cuoci in forno a 220 °C per 25 minuti.~È la pizza alta e morbida delle feste palermitane.`,
`Torta pasqualina~pizza~70~Media~GUL~Pasta sfoglia:P:2:rotoli;Bietole:F:600;Ricotta:L:300;Uova:L:6:pz;Parmigiano:L:60;Cipolle:F:1:pz~Lessa le bietole, strizzale, tritale e saltale in padella con la cipolla tritata e un filo d’olio.|Mescolale con ricotta, 2 uova, parmigiano, sale e noce moscata.|Fodera una teglia con un rotolo di sfoglia e versa il ripieno.|Fai 4 incavi e rompi in ognuno un uovo intero; copri con la seconda sfoglia e sigilla.|Bucherella la superficie e cuoci a 190 °C per 45 minuti.~Tagliandola, le uova intere al centro fanno un bellissimo effetto.`,
`Erbazzone~pizza~60~Media~GL~Pasta brisée:P:2:rotoli;Bietole:F:800;Parmigiano:L:100;Pancetta:C:80;Cipolle:F:1:pz;Aglio:F:1:spicchi~Lessa le bietole, strizzale bene e tritale.|Rosola pancetta, cipolla e aglio tritati in padella per 5 minuti, poi aggiungi le bietole e cuoci 5 minuti.|Spegni e unisci il parmigiano, sale e pepe.|Fodera una teglia con un rotolo, versa il ripieno e copri con il secondo, sigillando i bordi.|Bucherella la superficie e cuoci a 200 °C per 35 minuti.~È la torta salata di Reggio Emilia: buona calda e fredda.`,
`Panzerotti al forno~pizza~45~Facile~GL~Impasto per pizza:P:1000;Mozzarella:L:300;Passata:D:200;Origano:D:2~Scalda il forno a 220 °C.|Taglia la mozzarella a cubetti e lasciala scolare; condisci la passata con sale, olio e origano.|Dividi l’impasto in 8 palline e stendile in dischi.|Metti al centro un cucchiaio di passata e la mozzarella, richiudi a mezzaluna e sigilla bene premendo con una forchetta.|Spennella con olio e cuoci 18-20 minuti, finché sono dorati.~In Puglia si friggono: in forno sono più leggeri ma altrettanto buoni.`,
`Insalata di pasta al pesto e pomodorini~insalata~20~Facile~GLN~Fusilli:D:320;Pesto:D:1:vasetto;Pomodorini:F:300;Mozzarella:L:200~Cuoci i fusilli al dente, scolali e raffreddali sotto l’acqua fredda.|Taglia i pomodorini e la mozzarella a pezzetti.|Mescola la pasta con il pesto, i pomodorini e la mozzarella.|Lascia riposare in frigo 15 minuti prima di servire.~Perfetta da portare al lavoro o in spiaggia.`

`Polpettine di ricotta al sugo~uova~40~Facile~GUL~Ricotta:L:250;Uova:L:1:pz;Parmigiano:L:50;Pangrattato:D:80;Passata:D:500;Basilico:F:1:mazzo~Impasta ricotta, uovo, parmigiano, pangrattato e un pizzico di sale; se è morbido aggiungi altro pangrattato.|Forma polpettine grandi come una noce.|Scalda la passata con olio, sale e basilico per 5 minuti.|Adagia le polpettine nel sugo, copri e cuoci 15 minuti a fuoco dolce senza mescolare.~Il sugo è perfetto anche per condire la pasta.`,

function frAdd(){S.fru=1;S.fr.items.filter(x=>x.on&&!x.g).forEach(x=>{if(!has(x.n))S.pan.push(x.n)});if(S.step===5&&!S.hv)S.hv='own';S.fr=null;draw()}
function d2b(d){const[h,b]=d.split(','),bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:(h.match(/:(.*?);/)||[])[1]||'image/jpeg'})}
async function frFile(files){const raw=[...files].slice(0,FR.l.maxCount||3);if(!raw.length)return;S.fr={st:'wait'};draw();frC=new AbortController();
const fl=[];let bad=0;for(const f of raw){try{fl.push(d2b(await shrink(f,1568,1800000)))}catch(e){bad++}}
if(!fl.length){S.fr={st:'err',m:'Non riesco ad aprire '+(raw.length>1?'queste foto':'questa foto')+'. Se il telefono salva le foto in formato HEIC, imposta la fotocamera su “Più compatibile” (JPEG) oppure fai uno screenshot della foto e usa quello.'};draw();return}
const names=[...new Set(R.flatMap(r=>r.ing.map(i=>i[0])))].join(', ');
try{const d=await aiCall(S.frw==='scontrino'?'scontrino':'frigo',{images:fl,names},frC.signal);
const seen=new Set(),it=[];(d&&d.items||[]).forEach(x=>{let n=String(x.nome||'').trim().slice(0,40);if(!n)return;const c=R.flatMap(r=>r.ing).find(i=>i[0].toLowerCase()===n.toLowerCase());n=c?c[0]:n[0].toUpperCase()+n.slice(1);if(seen.has(n.toLowerCase()))return;seen.add(n.toLowerCase());const g=has(n);it.push({n,u:x.sicuro===false,on:false,g})});it.sort((a,b)=>(a.g?1:0)-(b.g?1:0));
S.fr={st:'res',items:it.slice(0,60),bad}}
catch(e){const c=e&&e.code;if(c==='cancelled')S.fr=null;else if(['not_granted','sampling_disabled','images_unavailable','not_declared','capability_disabled'].includes(c)){FR=null;S.fr=null}else S.fr={st:'err',m:c==='login'?'Devi accedere al tuo account per usare le foto.':c==='limit'?'Hai raggiunto il limite di foto per oggi: riprova domani.':c==='image_rejected'?'La foto non è stata accettata: prova con un’altra o fai uno screenshot della foto.':c==='rate_limited'?'Troppe richieste, riprova tra poco.':c==='invalid_json'?'Non sono riuscito a leggere il risultato: riprova.':'Qualcosa è andato storto: riprova.',dt:String((c||'')+(e&&e.message?' – '+e.message:'')).slice(0,160).replace(/[<>&"]/g,'')}}
draw()}
function askX(n,rid){S.xq={n,rid};draw()}
function xqSheet(){const q=S.xq,r=q.rid>=0;return `<div class="sheet" onclick="S.xq=null;draw()"><div onclick="event.stopPropagation()"><h2>Escludere «${q.n.toLowerCase()}»?</h2><p class="mut">Scegli se vale sempre o solo questa volta.</p><button class="btn" onclick="xqDo(1)">Per sempre</button><button class="btn" style="background:var(--soft);color:var(--pine)" onclick="xqDo(0)">${r?'Solo in questa ricetta':'Solo per questa spesa'}</button><button class="pill" style="margin-top:12px" onclick="S.xq=null;draw()">Annulla</button></div></div>`}
function xqDo(f){const q=S.xq;S.xq=null;if(f){gex(q.n);return}const n=q.n.toLowerCase();if(q.rid>=0){const k=R[q.rid].n;S.od[k]=S.od[k]||[];if(!S.od[k].includes(n))S.od[k].push(n)}else if(!S.sk.includes(n))S.sk.push(n);draw()}
const FO={},UL=['g','ml','pz','mazzo','spicchi','lattine','vasetto','bustina','cespo','l'];
const hash=s=>{let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return h.toString(36)};
const pid=r=>r.cid||('b'+hash(r.n)),qa=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const cl=s=>String(s||'').replace(/[<>"`&\\]/g,'').replace(/'/g,'’').trim();
const AA={L:/latte|burro|panna|formagg|mozzarella|parmigiano|pecorino|ricotta|gorgonzola|besciamella|yogurt|fontina|feta|squacquerone/i,G:/pasta|spaghetti|penne|fusilli|rigatoni|tagliatelle|orecchiette|farfalle|paccheri|bucatini|pane|farina|pangrattato|gnocchi|cous|farro|piadina|sfoglie|impasto|lasagn|crostini/i,U:/^uova|uovo|tuorl/i,P:/tonno|salmone|merluzzo|orata|branzino|platessa|gamberi|vongole|acciug|pesce|calamari|cozze|polpo|spigola/i,N:/noci|mandorle|nocciol|pistacch|pesto|pinoli|arachid/i};
const autoAl=ing=>Object.keys(AA).filter(k=>ing.some(x=>AA[k].test(x[0]))).map(k=>AL[k]);
function addMine(rec,img){const o={b:rec.n,t:'',n:rec.n,e:CE[rec.c],c:rec.c,al:rec.al,ing:rec.ing,s:rec.s,tmv:rec.tmv,dv:rec.dv,tip:rec.tip||'',cid:rec.id,mine:1,top:0,img:''};
if(img!==undefined)FO[rec.id]=img;o.img=FO[rec.id]||'';const i=R.findIndex(r=>r.cid===rec.id);if(i>=0)R[i]=o;else R.push(o)}
async function loadMine(){try{const c=await DB.collection('ricette').get();c.docs.forEach(d=>{const x=d.data();if(x&&x.id)addMine(x)});const f=await DB.collection('foto').get();f.docs.forEach(d=>{const x=d.data();if(x&&x.img)FO[d.id]=x.img});R.forEach(r=>{const k=pid(r);if(FO[k])r.img=FO[k]})}catch(e){}}
async function shrink(file,mx,lim){mx=mx||720;lim=lim||150000;const url=URL.createObjectURL(file);try{const im=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=url});const k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);let q=.8,d=c.toDataURL('image/jpeg',q);while(d.length>lim&&q>.4){q-=.1;d=c.toDataURL('image/jpeg',q)}return d}finally{URL.revokeObjectURL(url)}}
async function dPhoto(id,fl){if(!fl||!fl[0])return;const r=R[id];try{const img=await shrink(fl[0]);if(DB)await DB.collection('foto').doc(pid(r)).set({img});FO[pid(r)]=img;r.img=img}catch(e){}draw()}
async function dPhotoDel(id){const r=R[id];try{if(DB)await DB.collection('foto').doc(pid(r)).delete()}catch(e){}delete FO[pid(r)];r.img='';draw()}
function openMr(){S.mr=1;S.ed=null;S.tab=0;draw(1)}
const edIngFrom=i=>({n:i[0],q:String(i[2]),u:i[3]==='lattina'?'lattine':i[3],r:i[1]});
function newRec(){S.ed={cid:'',n:'',c:'pasta',tmv:'30',dv:'Facile',al:[],ing:[{n:'',q:'',u:'g',r:'Dispensa'}],s:[''],tip:'',img:'',hadImg:false,err:''};draw(1)}
function editRec(cid){const r=R.find(x=>x.cid===cid);if(!r)return;S.det=null;S.mr=1;S.tab=0;S.ed={cid,n:r.n,c:r.c,tmv:String(r.tmv),dv:r.dv,al:[...r.al],ing:r.ing.map(edIngFrom),s:[...r.s],tip:r.tip||'',img:r.img||'',hadImg:!!r.img,err:''};draw(1)}
function cloneRec(id,k){const r=R[id],ms=slot(k||0);S.det=null;S.mr=1;S.tab=0;S.ed={cid:'',n:r.n+' (mia versione)',c:r.c,tmv:String(tm(r)),dv:hard(r),al:[...r.al],ing:r.ing.filter(i=>!dropped(r,ms,i)).map(edIngFrom),s:air(r,steps(r,ms)).slice(),tip:r.tip||'',img:r.img||'',hadImg:false,err:''};draw(1)}
function edAdd(w){if(w==='ing')S.ed.ing.push({n:'',q:'',u:'g',r:'Dispensa'});else S.ed.s.push('');draw()}
function edDel(w,i){const a=w==='ing'?S.ed.ing:S.ed.s;if(a.length>1)a.splice(i,1);draw()}
function edAl(a){const l=S.ed.al,i=l.indexOf(a);i<0?l.push(a):l.splice(i,1);draw()}
function edIng(i,k,v){const x=S.ed.ing[i];x[k]=v;if(k==='n'){const kn=R.flatMap(r=>r.ing).find(y=>y[0].toLowerCase()===String(v).trim().toLowerCase());if(kn){x.r=kn[1];x.u=kn[3]==='lattina'?'lattine':kn[3]}}draw()}
async function edPhoto(f){if(!f||!f[0])return;try{S.ed.img=await shrink(f[0])}catch(e){}draw()}
async function saveRec(){const e=S.ed,n=cl(e.n),ing=e.ing.map(x=>[cl(x.n),x.r,parseFloat(x.q),x.u]).filter(x=>x[0]),s=e.s.map(cl).filter(Boolean);
const bad=!n?'Scrivi il nome della ricetta.':!ing.length?'Aggiungi almeno un ingrediente.':ing.some(x=>!(x[2]>0))?'Inserisci la quantità di ogni ingrediente.':!s.length?'Scrivi almeno un passaggio.':'';
if(bad){e.err=bad;draw();return}
let name=n;if(R.some(r=>r.n===name&&r.cid!==e.cid&&!r.del))name+=' (mia)';
const id=e.cid||('c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),al=[...new Set([...e.al,...autoAl(ing)])],rec={id,n:name,c:e.c,tmv:Math.max(1,parseInt(e.tmv)||20),dv:e.dv,al,ing,s,tip:cl(e.tip)};
try{if(DB){await DB.collection('ricette').doc(id).set(rec);if(e.img)await DB.collection('foto').doc(id).set({img:e.img});else if(e.hadImg)await DB.collection('foto').doc(id).delete()}}catch(x){e.err='Non sono riuscito a salvare: riprova.';draw();return}
addMine(rec,e.img||'');S.nx=null;S.ed=null;fix();draw(1)}
async function delRec(cid){if(S.dq!==cid){S.dq=cid;draw();return}S.dq=null;const i=R.findIndex(r=>r.cid===cid);if(i>=0)R[i].del=1;try{if(DB){await DB.collection('ricette').doc(cid).delete();await DB.collection('foto').doc(cid).delete()}}catch(x){}S.nx=null;fix();draw()}
function ingRow(x,i){return `<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)"><div class="row"><input type="text" list="dl" placeholder="Ingrediente" value="${qa(x.n)}" onchange="edIng(${i},'n',this.value)" style="flex:1"><button class="mut" aria-label="Togli ingrediente" onclick="edDel('ing',${i})">✕</button></div><div class="row" style="margin-top:8px;gap:8px"><input type="number" min="0" step="any" placeholder="Quantità" value="${qa(x.q)}" oninput="S.ed.ing[${i}].q=this.value" style="width:100px"><select onchange="S.ed.ing[${i}].u=this.value">${UL.map(u=>`<option ${x.u===u?'selected':''}>${u}</option>`).join('')}</select><select onchange="S.ed.ing[${i}].r=this.value" style="flex:1;min-width:0">${REP.map(r=>`<option ${x.r===r?'selected':''}>${r}</option>`).join('')}</select></div></div>`}
function edScr(){const e=S.ed,names=[...new Set(R.flatMap(r=>r.ing.map(i=>i[0])))].sort();
return `<div class="scr"><button class="pill" onclick="S.ed=null;draw(1)">← Indietro</button><h1 style="margin-top:12px">${e.cid?'Modifica ricetta':'Nuova ricetta'}</h1><datalist id="dl">${names.map(n=>`<option value="${qa(n)}">`).join('')}</datalist>
<div class="card"><label class="mut">Nome</label><input type="text" value="${qa(e.n)}" oninput="S.ed.n=this.value" placeholder="es. Lasagne della nonna"><label class="mut" style="display:block;margin-top:12px">Foto</label>${e.img?`<img src="${e.img}" alt="" style="width:100%;max-height:200px;object-fit:cover;border-radius:16px;margin-top:6px">`:''}<input type="file" id="edf" accept="image/*" style="display:none" onchange="edPhoto(this.files)"><div style="margin-top:8px"><button class="pill sun" onclick="document.getElementById('edf').click()">📷 ${e.img?'Cambia foto':'Aggiungi foto'}</button>${e.img?' <button class="pill" onclick="S.ed.img=\'\';draw()">Rimuovi</button>':''}</div></div>
<div class="card"><label class="mut">Tipo di piatto</label><div style="margin-top:6px">${Object.entries(CATS).map(([k,t])=>`<button class="chip ${e.c===k?'on':''}" onclick="S.ed.c='${k}';draw()">${t}</button>`).join('')}</div><label class="mut" style="display:block;margin-top:8px">Tempo (minuti)</label><input type="number" min="1" value="${qa(e.tmv)}" oninput="S.ed.tmv=this.value"><label class="mut" style="display:block;margin-top:12px">Difficoltà</label><div style="margin-top:6px">${['Facile','Media'].map(d=>`<button class="chip ${e.dv===d?'on':''}" onclick="S.ed.dv='${d}';draw()">${d}</button>`).join('')}</div></div>
<div class="card"><b>Ingredienti</b><p class="mut">Quantità per 4 persone. Scegli il reparto giusto: con carne o pesce le diete vegetariane escludono il piatto.</p>${e.ing.map(ingRow).join('')}<button class="pill" style="margin-top:12px" onclick="edAdd('ing')">+ Ingrediente</button></div>
<div class="card"><b>Allergeni</b><p class="mut">Li riconosco anche dagli ingredienti; qui puoi aggiungerne altri.</p>${Object.values(AL).map(a=>`<button class="chip al ${e.al.includes(a)?'on':''}" onclick="edAl('${a}')">${a}</button>`).join('')}</div>
<div class="card"><b>Procedimento</b>${e.s.map((x,i)=>`<div class="row" style="margin-top:10px;align-items:flex-start;gap:8px"><span class="mut" style="padding-top:12px">${i+1}.</span><textarea oninput="S.ed.s[${i}]=this.value" placeholder="Descrivi il passaggio">${qa(x)}</textarea><button class="mut" aria-label="Togli passaggio" style="padding-top:10px" onclick="edDel('s',${i})">✕</button></div>`).join('')}<button class="pill" style="margin-top:12px" onclick="edAdd('s')">+ Passaggio</button></div>
<div class="card"><label class="mut">Consiglio (facoltativo)</label><input type="text" value="${qa(e.tip)}" oninput="S.ed.tip=this.value" placeholder="es. Meglio il giorno dopo"></div>
${e.err?`<p style="color:var(--berry)">${e.err}</p>`:''}<button class="btn" onclick="saveRec()">Salva la ricetta</button></div>`}
function mrScr(){if(S.ed)return edScr();const L=R.filter(r=>r.mine&&!r.del);
return `<div class="scr"><button class="pill" onclick="S.mr=0;draw(1)">← Indietro</button><h1 style="margin-top:12px">Le mie ricette</h1><p class="mut">Crea le tue ricette, anche con la foto: entrano nel menu e nella lista della spesa come le altre.</p>${DB?'':'<div class="card mut">Il salvataggio non è attivo: apri il prototipo dal tuo account claude.ai per tenere le ricette tra una visita e l’altra.</div>'}<button class="btn" onclick="newRec()">+ Nuova ricetta</button><div style="margin-top:12px">${impBox()}</div>${L.map(r=>`<div class="card row" style="gap:12px"><button class="row" style="flex:1;gap:12px;text-align:left" onclick="editRec('${r.cid}')">${ph(r,56)}<div style="flex:1"><b>${r.n}</b><div class="mut">${CATS[r.c]} · ${tm(r)} min</div>${S.dq===r.cid?'<div style="color:var(--berry);font-size:12px">Tocca 🗑 ancora per eliminare</div>':''}</div></button><button class="mut" aria-label="Elimina ${r.n}" onclick="delRec('${r.cid}')">🗑</button></div>`).join('')||'<p class="mut" style="margin-top:14px">Non hai ancora creato ricette. Puoi anche partire da una ricetta esistente con "Crea una mia versione".</p>'}</div>`}
const avOk=s=>typeof s==='string'&&/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(s);
const av=(p,s)=>avOk(p.av)?`<div class="ph" style="width:${s}px;height:${s}px;border-radius:50%;background:url('${p.av}') center/cover"></div>`:`<div class="ph" style="width:${s}px;height:${s}px;border-radius:50%;background:var(--soft);font-size:${Math.round(s*.5)}px">${p.a<14?'🧒':'🧑'}</div>`;
const avBtn=(p,i,s)=>`<input type="file" id="avf${i}" accept="image/*" style="display:none" onchange="setAv(${i},this.files)"><button aria-label="Cambia foto di ${qa(p.n)}" style="position:relative;flex:none" onclick="document.getElementById('avf${i}').click()">${av(p,s)}<span style="position:absolute;right:-2px;bottom:-2px;background:var(--pine);color:#fff;border-radius:50%;width:20px;height:20px;font-size:11px;display:grid;place-items:center">📷</span></button>`;
async function setAv(i,fl){if(!fl||!fl[0]||!S.m[i])return;try{S.m[i].av=await shrink(fl[0],160,14000)}catch(e){}draw()}
function delAv(i){if(S.m[i])delete S.m[i].av;draw()}
function sdCfg(){return `<h3 style="margin-top:18px">Giorno della spesa</h3><div style="margin-top:8px">${DAYS.map((d,i)=>`<button class="chip ${S.sd===i?'on':''}" onclick="setSd(${i})">${d.slice(0,3)}</button>`).join('')}</div><p class="mut">Il menu parte da quel giorno e la lista è pronta per fare la spesa.</p><div><button class="chip ${S.nt?'on':''}" onclick="S.nt=!S.nt;syncNotif();draw()">🔔 Avviso la mattina</button>${[7,8,9].map(h=>`<button class="chip ${S.nh===h?'on':''}" onclick="S.nh=${h};syncNotif();draw()">${h}:00</button>`).join('')}</div>${LNp()?'':'<p class="mut">Gli avvisi funzionano nell’app Android.</p>'}`}
let py=null,pd=0;
if($.addEventListener){$.addEventListener('touchstart',e=>{const sc=$.querySelector('.scr');py=(S.step===4&&S.tab<=3&&!S.sheet&&!S.det&&!S.ospiti&&!S.vv&&!S.pl&&!S.mr&&sc&&sc.scrollTop<=0)?e.touches[0].clientY:null;pd=0},{passive:true});
$.addEventListener('touchmove',e=>{if(py===null)return;pd=e.touches[0].clientY-py;const el=$.querySelector('#ptr');if(el){el.style.height=Math.max(0,Math.min(60,pd/2))+'px';el.textContent=pd>110?'Rilascia per aggiornare':pd>10?'Tira per aggiornare':''}},{passive:true});
$.addEventListener('touchend',()=>{const go=py!==null&&pd>110;py=null;const el=$.querySelector('#ptr');if(el){el.style.height='0';el.textContent=''}if(go){refreshAll();if(typeof vPull==='function')vPull()}})}
if(document.addEventListener)document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ready){daily();draw()}});
const bk=()=>'<button class="pill" onclick="back()">← Indietro</button>';
function back(){const s=S.step;
if(s===1){if(S.one){if(S.add){S.m.pop();S.pi=Math.max(0,S.m.length-1);S.add=0}S.one=0;S.step=4;S.tab=4}else if(S.pi>0){S.pi--;S.step=3}else S.step=0}
else if(s===2||s===3)S.step=s-1;
else if(s===6){S.step=3;S.pi=S.m.length-1}
else if(s===5)S.step=6;
draw(1)}
const canBack=()=>S.step!==4?S.step!==0:!!(S.aiL||S.chef||S.ai||S.vs!=null||S.pap||S.sv||S.rf!==null||S.xq||S.det||S.sheet||S.ospiti||S.vv||S.pl||S.mr||S.tab!==0);
function goBack(){if(S.step!==4){back();return}if(S.aiL)S.aiL=0;else if(S.chef)S.chef=null;else if(S.vs!=null)S.vs=null;else if(S.ai)S.ai=null;else if(S.pap)S.pap=null;else if(S.sv){svEnd();return}else if(S.rf!==null)S.rf=null;else if(S.xq)S.xq=null;else if(S.det)S.det=null;else if(S.sheet)S.sheet=null;else if(S.ed)S.ed=null;else if(S.ospiti||S.vv||S.pl||S.mr){S.ospiti=0;S.vv=0;S.pl=0;S.mr=0}else if(S.tab!==0)S.tab=0;draw(1)}
try{if(typeof history!=='undefined'&&history.pushState&&window.addEventListener){history.replaceState({r:1},'');history.pushState({r:2},'');window.addEventListener('popstate',()=>{if(canBack()){goBack();history.pushState({r:2},'')}})}}catch(e){}
draw();bootGo(initCloud());initFr();
</script></body></html>
