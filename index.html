<script>

const CLOUD_CFG={url:'https://edezeqmrmqgzfzzoobhu.supabase.co',key:'sb_publishable_KZHWWWfGrqAXqw8CoZ6W8A_LGofYr91'};

  const LS='cm_session';let ses=null;

  const H=t=>({apikey:CLOUD_CFG.key,'Content-Type':'application/json',Authorization:'Bearer '+(t||CLOUD_CFG.key)});
  async function call(path,opt){const r=await fetch(CLOUD_CFG.url+path,Object.assign({signal:(typeof AbortSignal!=='undefined'&&AbortSignal.timeout)?AbortSignal.timeout(12000):undefined},opt));const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.msg||j.error_description||j.message||('Errore '+r.status));return j}

    async signIn(email,pw,ct){setS(await call('/auth/v1/token?grant_type=password',{method:'POST',headers:H(),body:JSON.stringify(Object.assign({email,password:pw},cap(ct)))}));await this.findHousehold()},
    async verify(email,token){setS(await call('/auth/v1/verify',{method:'POST',headers:H(),body:JSON.stringify({type:'signup',email,token})}));await this.findHousehold()},
    async resend(email,ct){await call('/auth/v1/resend',{method:'POST',headers:H(),body:JSON.stringify(Object.assign({type:'signup',email},cap(ct)))})},

    async findHousehold(){const r=await rest('household_members?select=household_id&limit=1');if(r[0]){ses.hh=r[0].household_id;save(ses)}return ses.hh||null},

  }

<script>

const R=[];
[`al pomodoro e basilico~Spaghetti,Penne,Fusilli,Rigatoni,Paccheri,Orecchiette~25~Facile~G~Passata:D:400;Basilico:F:1:mazzo;Aglio:F:1:spicchi~Scalda 3 cucchiai d’olio con l’aglio schiacciato a fuoco dolce per 1 minuto.|Aggiungi la passata, un pizzico di sale e qualche foglia di basilico e cuoci 15 minuti a fuoco medio-basso.|Cuoci {p} in abbondante acqua salata e scola la pasta al dente, tenendo da parte un mestolo d’acqua di cottura.|Togli l’aglio e salta la pasta nel sugo per 1 minuto, allungando con poca acqua di cottura.|Completa con basilico fresco e un filo d’olio a crudo.~Se la passata è troppo acida, un pizzico di zucchero la addolcisce.`,
`al ragù~Rigatoni,Penne,Paccheri,Fusilli~90~Facile~GL~Macinato misto:C:400;Passata:D:500;Carote:F:1:pz;Sedano:F:1:pz;Cipolle:F:1:pz;Vino rosso:D:100:ml;Parmigiano:L:50~Trita finemente cipolla, carota e sedano e falli appassire in pentola con 3 cucchiai d’olio per 8 minuti.|Aggiungi il macinato e rosolalo a fuoco vivo, sgranandolo, finché non è più rosa.|Sfuma con il vino rosso e lascialo evaporare.|Unisci la passata, mezzo bicchiere d’acqua e sale; copri e cuoci a fuoco bassissimo per almeno 60 minuti, mescolando ogni tanto.|Cuoci {p} al dente, scola e condisci con il ragù e il parmigiano grattugiato.~Fanne il doppio: il ragù si congela benissimo.`,
`alla carbonara~Rigatoni,Mezze maniche~25~Media~GUL~Guanciale:C:150;Uova:L:4:pz;Pecorino:L:70~Taglia il guanciale a listarelle e rosolalo in padella senza olio per 8 minuti, finché è croccante.|In una ciotola sbatti le uova con il pecorino e abbondante pepe nero.|Cuoci {p} in acqua salata e scola la pasta al dente, tenendo un mestolo d’acqua di cottura.|A fuoco spento unisci la pasta al guanciale, poi versa le uova mescolando veloce.|Allunga con poca acqua di cottura fino a ottenere una crema e servi subito.~Mai riaccendere il fuoco dopo aver aggiunto le uova: si strapazzano.`,
`cacio e pepe~Tonnarelli,Rigatoni~20~Media~GL~Pecorino:L:150;Pepe nero:D:5~Gratta il pecorino molto fine e lavoralo in una ciotola con poca acqua tiepida fino a una crema densa.|Tosta il pepe macinato grosso in padella 1 minuto, poi aggiungi un mestolo d’acqua di cottura.|Cuoci {p} in poca acqua salata e scola la pasta molto al dente.|Saltala nel pepe, spegni il fuoco e manteca con la crema di pecorino, aggiungendo acqua di cottura.|Servi subito, ben cremosa.~Usa acqua tiepida, non bollente: il pecorino non fa grumi.`,
`all’amatriciana~Spaghetti,Rigatoni,Mezze maniche~30~Media~GL~Guanciale:C:150;Passata:D:400;Pecorino:L:60;Vino bianco:D:50:ml;Peperoncino:F:1:pz~Taglia il guanciale a listarelle e rosolalo in padella senza olio per 8 minuti, finché è dorato.|Sfuma con il vino bianco, poi togli il guanciale e tienilo da parte perché resti croccante.|Nel grasso rimasto aggiungi il peperoncino e la passata e cuoci 15 minuti.|Cuoci {p} al dente, scola e salta la pasta nel sugo con il guanciale.|Spegni e manteca con il pecorino grattugiato.~Niente aglio né cipolla: la ricetta di Amatrice non li prevede.`,
`con zucchine e pancetta~Penne,Fusilli,Farfalle,Spaghetti~25~Facile~GL~Zucchine:F:400;Pancetta:C:120;Cipolle:F:1:pz;Parmigiano:L:40~Affetta la cipolla e rosolala con 2 cucchiai d’olio e la pancetta a dadini per 5 minuti.|Aggiungi le zucchine a dadini e cuoci 10 minuti a fuoco medio, finché sono morbide e dorate.|Cuoci {p} al dente, tenendo da parte un mestolo d’acqua di cottura.|Salta la pasta nel condimento con un po’ d’acqua di cottura e il parmigiano.~Per una versione più cremosa schiaccia qualche zucchina con la forchetta.`,
`al pesto~Linguine,Fusilli,Penne~15~Facile~GLN~Pesto:D:1:vasetto;Parmigiano:L:30~Cuoci {p} in abbondante acqua salata.|In una ciotola grande diluisci il pesto con 2-3 cucchiai d’acqua di cottura.|Scola la pasta al dente e condiscila con il pesto, fuori dal fuoco.|Completa con parmigiano grattugiato.~Il pesto non va mai scaldato in padella: perde profumo e diventa amaro.`,
`alle verdure~Penne,Fusilli,Farfalle,Rigatoni~30~Facile~G~Melanzane:F:1:pz;Zucchine:F:300;Peperoni:F:1:pz;Pomodorini:F:200;Aglio:F:1:spicchi;Basilico:F:1:mazzo~Taglia melanzana, zucchine e peperone a dadini piccoli e i pomodorini a metà.|Scalda 4 cucchiai d’olio con l’aglio, aggiungi melanzana e peperone e cuoci 8 minuti a fuoco vivace.|Unisci le zucchine e cuoci 6 minuti, poi i pomodorini per altri 4; sala.|Cuoci {p} al dente, scola e salta la pasta con le verdure e un po’ d’acqua di cottura.|Completa con basilico spezzato.~Una grattata di ricotta salata la rende ancora più siciliana.`,

`ai quattro formaggi~Penne,Rigatoni,Fusilli~20~Facile~GL~Gorgonzola:L:80;Fontina:L:80;Emmental:L:60;Parmigiano:L:50;Latte:L:150:ml~Taglia gorgonzola, fontina ed emmental a cubetti.|Scaldali in un pentolino a fuoco basso con il latte, mescolando, finché ottieni una crema liscia.|Cuoci {p} al dente e scola la pasta.|Condiscila con la crema e il parmigiano, allungando con poca acqua di cottura se serve.~Il fuoco deve restare basso: se bolle, i formaggi si separano.`,
`con broccoli e salsiccia~Orecchiette,Penne,Fusilli,Paccheri~30~Facile~GL~Broccoli:F:500;Salsiccia:C:300;Aglio:F:1:spicchi;Peperoncino:F:1:pz;Pecorino:L:40~Dividi i broccoli in cimette e lessali 5 minuti in abbondante acqua salata; tirali su con una schiumarola e tieni l’acqua.|In padella scalda olio, aglio e peperoncino e rosola la salsiccia sbriciolata per 8 minuti.|Unisci i broccoli e cuocili 5 minuti, schiacciandoli in parte.|Cuoci {p} nell’acqua dei broccoli, scola la pasta al dente e saltala nel condimento.|Completa con pecorino grattugiato.~Cuocere la pasta nell’acqua dei broccoli la rende più saporita.`,
`ai funghi e panna~Tagliatelle,Penne,Farfalle,Fusilli~25~Facile~GL~Funghi:F:400;Panna:L:200:ml;Aglio:F:1:spicchi;Prezzemolo:F:1:mazzo;Parmigiano:L:40~Pulisci i funghi con un panno umido e affettali.|Scalda olio e aglio, aggiungi i funghi e cuocili 10 minuti a fuoco vivace finché perdono l’acqua; sala e unisci il prezzemolo.|Versa la panna e lascia addensare 2 minuti a fuoco basso.|Cuoci {p} al dente, scola e salta la pasta nel sugo con il parmigiano.~Non lavare i funghi sotto l’acqua: assorbono acqua e non rosolano.`,
`con ricotta e limone~Spaghetti,Tagliatelle,Fusilli~15~Facile~GL~Ricotta:L:250;Limoni:F:2:pz;Parmigiano:L:40~Lava bene i limoni e grattugia la scorza, senza la parte bianca.|In una ciotola grande lavora la ricotta con la scorza, il succo di mezzo limone, il parmigiano e pepe.|Cuoci {p} al dente e scola la pasta tenendo un mestolo d’acqua di cottura.|Mescola la pasta con la crema di ricotta, allungando con acqua di cottura fino a renderla vellutata.~Usa limoni non trattati: la scorza è il cuore del piatto.`,
`con salmone e zucchine~Farfalle,Penne,Fusilli,Tagliatelle~25~Facile~GP~Salmone:C:250;Zucchine:F:300;Aglio:F:1:spicchi;Prezzemolo:F:1:mazzo~Taglia le zucchine a dadini e rosolale in padella con olio e aglio per 8 minuti.|Togli la pelle al salmone, taglialo a cubetti e uniscilo alle zucchine: cuoci 3-4 minuti mescolando poco.|Cuoci {p} al dente e scola la pasta.|Saltala nel condimento con un mestolo d’acqua di cottura e il prezzemolo tritato.~Una grattata di scorza di limone alla fine esalta il salmone.`,
`alla boscaiola~Penne,Tagliatelle,Fusilli~30~Facile~GL~Funghi:F:300;Salsiccia:C:200;Passata:D:250;Panna:L:100:ml;Aglio:F:1:spicchi;Prezzemolo:F:1:mazzo~Sbriciola la salsiccia e rosolala in padella con un filo d’olio per 5 minuti.|Aggiungi i funghi affettati e l’aglio e cuoci 8 minuti a fuoco vivace.|Unisci la passata e cuoci 10 minuti, poi la panna per 2 minuti.|Cuoci {p} al dente, scola e salta la pasta nel sugo con prezzemolo tritato.~Per una versione più leggera puoi togliere la panna.`,
`alla sorrentina~Paccheri,Penne~40~Facile~GL~Passata:D:500;Mozzarella:L:250;Basilico:F:1:mazzo;Parmigiano:L:40;Aglio:F:1:spicchi~Scalda il forno a 200 °C.|Prepara il sugo con olio, aglio, passata, sale e basilico e cuocilo 15 minuti.|Cuoci {p} molto al dente e condisci la pasta con il sugo.|Versala in una pirofila con la mozzarella a cubetti ben scolata e il parmigiano.|Gratina in forno 10 minuti, finché la mozzarella fila.~Taglia la mozzarella in anticipo e lasciala scolare: così non bagna la pasta.`,
`con piselli e prosciutto~Farfalle,Penne,Fusilli~25~Facile~GL~Piselli:S:300;Prosciutto cotto:C:150;Cipolle:F:1:pz;Panna:L:100:ml;Parmigiano:L:40~Trita la cipolla e falla appassire in padella con olio per 4 minuti.|Aggiungi i piselli, un mestolo d’acqua e un pizzico di sale e cuoci 10 minuti.|Unisci il prosciutto a dadini e la panna e cuoci 2 minuti.|Cuoci {p} al dente, scola e salta la pasta nel condimento con il parmigiano.~Piace moltissimo ai bambini.`

[`Risotto agli asparagi~riso~35~Media~L~Riso:D:320;Asparagi:F:500;Cipolle:F:1:pz;Burro:L:40;Parmigiano:L:60;Brodo vegetale:D:1:l;Vino bianco:D:80:ml~Taglia le punte degli asparagi e tienile da parte; affetta a rondelle i gambi teneri, scartando la parte legnosa.|Fai appassire la cipolla tritata con metà del burro, unisci i gambi e cuoci 3 minuti.|Aggiungi il riso, tostalo 2 minuti e sfuma con il vino bianco.|Cuoci 16-18 minuti aggiungendo il brodo caldo un mestolo alla volta; a metà cottura unisci le punte.|Spegni, manteca con il burro rimasto e il parmigiano e lascia riposare 2 minuti.~Con le parti dure scartate puoi insaporire il brodo.`,
`Risotto alla salsiccia~riso~35~Media~L~Riso:D:320;Salsiccia:C:250;Cipolle:F:1:pz;Vino bianco:D:80:ml;Brodo vegetale:D:1:l;Parmigiano:L:60;Burro:L:30~Fai appassire la cipolla tritata con un filo d’olio per 4 minuti.|Aggiungi la salsiccia sbriciolata e rosolala 5 minuti.|Unisci il riso, tostalo 2 minuti e sfuma con il vino bianco.|Cuoci 16-18 minuti aggiungendo il brodo caldo un mestolo alla volta.|Spegni, manteca con burro e parmigiano e lascia riposare 2 minuti.~Con un pizzico di zafferano diventa il risotto alla monzese.`,
`Risotto al radicchio~riso~35~Media~L~Riso:D:320;Radicchio:F:300;Cipolle:F:1:pz;Vino rosso:D:100:ml;Brodo vegetale:D:1:l;Parmigiano:L:60;Burro:L:30~Taglia il radicchio a listarelle sottili.|Fai appassire la cipolla tritata con un filo d’olio, aggiungi il radicchio e cuoci 3 minuti.|Unisci il riso, tostalo 2 minuti e sfuma con il vino rosso.|Cuoci 16-18 minuti aggiungendo il brodo caldo un mestolo alla volta.|Spegni, manteca con burro e parmigiano e lascia riposare 2 minuti.~Il radicchio di Treviso tardivo è il più dolce; quello tondo è più amaro.`,
`Risotto ai gamberi e zucchine~riso~35~Media~P~Riso:D:320;Gamberi:C:300;Zucchine:F:300;Aglio:F:1:spicchi;Vino bianco:D:80:ml;Brodo vegetale:D:1:l;Prezzemolo:F:1:mazzo~Sguscia i gamberi; taglia le zucchine a dadini.|Rosola le zucchine in pentola con olio e aglio per 5 minuti, poi togli l’aglio.|Aggiungi il riso, tostalo 2 minuti e sfuma con il vino bianco.|Cuoci 16-18 minuti aggiungendo il brodo caldo un mestolo alla volta; negli ultimi 3 minuti unisci i gamberi.|Spegni, manteca con un filo d’olio e prezzemolo tritato.~Con il pesce niente parmigiano: si manteca con olio extravergine.`,
`Risotto alle zucchine~riso~35~Facile~L~Riso:D:320;Zucchine:F:500;Cipolle:F:1:pz;Brodo vegetale:D:1:l;Parmigiano:L:60;Burro:L:30;Basilico:F:1:mazzo~Taglia le zucchine a dadini e falle rosolare con olio e cipolla tritata per 6 minuti.|Aggiungi il riso e tostalo 2 minuti.|Cuoci 16-18 minuti aggiungendo il brodo caldo un mestolo alla volta.|Spegni, manteca con burro e parmigiano e completa con basilico spezzato.~Frulla metà delle zucchine con un mestolo di brodo: il risotto viene più verde e cremoso.`,
`Insalata di riso classica~riso~30~Facile~UPL~Riso:D:320;Tonno:D:1:lattina;Prosciutto cotto:C:100;Würstel:C:2:pz;Giardiniera:D:200;Uova:L:2:pz;Emmental:L:100~Lessa il riso in acqua salata per 15 minuti, scolalo e raffreddalo sotto l’acqua fredda.|Rassoda le uova per 9 minuti, raffreddale e tagliale a spicchi.|Taglia a dadini prosciutto, würstel ed emmental; scola tonno e giardiniera.|Mescola tutto al riso con un filo d’olio e lascia riposare in frigo 30 minuti.~Usa riso parboiled: i chicchi restano separati.`,
`Insalata di riso con tonno e pomodorini~riso~25~Facile~P~Riso:D:320;Tonno:D:2:lattine;Pomodorini:F:300;Olive:D:60;Basilico:F:1:mazzo~Lessa il riso in acqua salata per 15 minuti, scolalo e raffreddalo sotto l’acqua fredda.|Taglia i pomodorini in quattro e scola il tonno.|Mescola riso, tonno, pomodorini, olive e basilico con olio e sale.|Lascia riposare in frigo 20 minuti prima di servire.~Si conserva un giorno in frigo: perfetta per il pranzo in ufficio.`,
`Insalata di riso con pomodorini e mozzarella~riso~25~Facile~L~Riso:D:320;Pomodorini:F:300;Mozzarella:L:250;Olive:D:60;Basilico:F:1:mazzo~Lessa il riso in acqua salata per 15 minuti, scolalo e raffreddalo sotto l’acqua fredda.|Taglia pomodorini e mozzarella a cubetti e lascia scolare la mozzarella.|Mescola tutto con olive, basilico, olio e sale.|Lascia riposare in frigo 20 minuti prima di servire.~Le mozzarelline ciliegina sono comodissime.`,
`Riso saltato alla cantonese~riso~25~Facile~U~Riso:D:300;Uova:L:3:pz;Piselli:S:200;Prosciutto cotto:C:120;Cipolle:F:1:pz~Lessa il riso al dente, scolalo e lascialo raffreddare (va benissimo quello del giorno prima).|Strapazza le uova in padella con un filo d’olio e mettile da parte.|Rosola la cipolla tritata, aggiungi i piselli e cuoci 5 minuti, poi il prosciutto a dadini.|Unisci riso e uova e salta tutto a fuoco vivo per 4 minuti.~Il riso freddo non si attacca: ottimo per riciclare gli avanzi.`,
`Riso venere con gamberi e zucchine~riso~45~Facile~P~Riso venere:D:300;Gamberi:C:300;Zucchine:F:300;Aglio:F:1:spicchi;Prezzemolo:F:1:mazzo~Lessa il riso venere in acqua salata per il tempo indicato (di solito 35-40 minuti) e scolalo.|Rosola le zucchine a dadini con olio e aglio per 6 minuti.|Aggiungi i gamberi sgusciati e cuocili 2 minuti.|Unisci il riso, salta 1 minuto e completa con prezzemolo e olio a crudo.~È buono anche tiepido o freddo, come insalata.`,
`Petto di pollo alla piastra con insalata~carne~20~Facile~~Petto di pollo:C:600;Insalata:F:1:cespo;Pomodori:F:300;Limoni:F:1:pz~Taglia il petto a fette di 1 cm e battile leggermente.|Ungile con un filo d’olio.|Cuocile su piastra o padella ben calda 3 minuti per lato e sala alla fine.|Servi con insalata e pomodori conditi con olio, sale e limone.~Non girare le fette troppo presto: si staccano da sole quando sono pronte.`,
`Bocconcini di pollo con zucchine~carne~25~Facile~~Petto di pollo:C:600;Zucchine:F:400;Cipolle:F:1:pz~Taglia il pollo a bocconcini, le zucchine a dadini e la cipolla a fettine.|Rosola la cipolla con olio per 3 minuti, poi aggiungi il pollo e cuoci 6 minuti a fuoco vivo.|Unisci le zucchine, sala e cuoci 10 minuti con il coperchio.|Togli il coperchio e lascia insaporire 2 minuti.~Con un pizzico di curcuma diventa ancora più colorato.`,
`Bocconcini di pollo ai funghi~carne~25~Facile~G~Petto di pollo:C:600;Funghi:F:300;Farina:D:30;Aglio:F:1:spicchi;Prezzemolo:F:1:mazzo;Vino bianco:D:80:ml~Taglia il pollo a bocconcini e infarinalo leggermente.|Rosola i funghi affettati con olio e aglio per 8 minuti e mettili da parte.|Nella stessa padella rosola il pollo 5 minuti e sfuma con il vino.|Rimetti i funghi, sala e cuoci 5 minuti finché si forma una cremina; completa con prezzemolo.~La farina addensa il fondo: niente panna.`,
`Cotolette di pollo~carne~25~Facile~GU~Petto di pollo:C:600;Uova:L:2:pz;Pangrattato:D:150;Limoni:F:1:pz~Taglia il petto a fette sottili e battile leggermente.|Passale nell’uovo sbattuto con un pizzico di sale, poi nel pangrattato, premendo bene.|Cuocile in padella con olio caldo 3-4 minuti per lato, finché sono dorate.|Asciugale su carta da cucina e servi con il limone.~Per una versione più leggera cuocile in forno a 200 °C per 15 minuti.`,
`Spezzatino di pollo con piselli~carne~45~Facile~~Pollo a pezzi:C:1000;Piselli:S:400;Cipolle:F:1:pz;Passata:D:200~Rosola il pollo in pentola con olio per 10 minuti, finché è dorato.|Aggiungi la cipolla affettata e cuoci 3 minuti.|Unisci passata, piselli, sale e un mestolo d’acqua; copri e cuoci a fuoco dolce 25 minuti.|Scopri gli ultimi 5 minuti per restringere il sugo.~Con le sovracosce resta più morbido che con il petto.`,
`Fesa di tacchino con verdure grigliate~carne~30~Facile~~Fesa di tacchino:C:600;Zucchine:F:300;Melanzane:F:1:pz;Peperoni:F:1:pz~Taglia zucchine e melanzana a fette sottili e il peperone a falde.|Grigliale su piastra ben calda 3-4 minuti per lato e condiscile con olio e sale.|Cuoci sulla stessa piastra le fette di tacchino 3 minuti per lato.|Servi la carne con le verdure e un filo d’olio a crudo.~Una marinata di 10 minuti con olio, limone e rosmarino rende il tacchino più morbido.`,
`Arrosto di tacchino con patate~carne~80~Facile~~Fesa di tacchino:C:900;Patate:F:800;Rosmarino:F:1:mazzo;Aglio:F:2:spicchi;Vino bianco:D:100:ml~Scalda il forno a 190 °C.|Lega la fesa con lo spago e rosolala in una teglia sul fuoco con olio, aglio e rosmarino, 2 minuti per lato.|Sfuma con il vino, aggiungi le patate a tocchi, sala e condisci con olio.|Cuoci in forno 55-60 minuti, girando arrosto e patate a metà.|Lascia riposare la carne 10 minuti prima di affettarla.~Ottimo anche freddo, affettato sottile per i panini.`,
`Involtini di tacchino prosciutto e formaggio~carne~30~Facile~GL~Fesa di tacchino:C:600;Prosciutto cotto:C:100;Fontina:L:100;Farina:D:30;Vino bianco:D:80:ml~Batti le fettine di tacchino perché siano sottili.|Su ognuna metti una fetta di prosciutto e un bastoncino di fontina, arrotola e chiudi con uno stecchino.|Infarina gli involtini e rosolali in padella con olio per 5 minuti.|Sfuma con il vino, copri e cuoci 10 minuti a fuoco dolce.~Togli gli stecchini prima di servirli ai bambini.`,
`Arista di maiale al forno con patate~carne~90~Facile~~Arista di maiale:C:1000;Patate:F:800;Rosmarino:F:1:mazzo;Aglio:F:3:spicchi;Vino bianco:D:100:ml~Scalda il forno a 180 °C.|Massaggia l’arista con olio, sale, pepe, aglio e rosmarino tritati.|Mettila in una teglia con le patate a tocchi condite con olio e sale.|Cuoci 30 minuti, sfuma con il vino e cuoci altri 40 minuti, girando le patate.|Lascia riposare 10 minuti prima di affettare.~Il riposo finale tiene i succhi dentro la carne.`,
`Lonza di maiale ai funghi~carne~30~Facile~G~Lonza di maiale:C:600;Funghi:F:300;Farina:D:30;Vino bianco:D:80:ml;Prezzemolo:F:1:mazzo;Aglio:F:1:spicchi~Infarina le fette di lonza.|Rosola i funghi affettati con olio e aglio per 8 minuti e mettili da parte.|Nella stessa padella rosola la lonza 2 minuti per lato e sfuma con il vino.|Rimetti i funghi, sala e cuoci 5 minuti; completa con prezzemolo.~Non cuocerla troppo: la lonza si asciuga in fretta.`,
`Braciole di maiale alla piastra con insalata~carne~20~Facile~~Braciole di maiale:C:800;Insalata:F:1:cespo;Pomodori:F:300;Rosmarino:F:1:mazzo~Incidi il grasso sul bordo delle braciole perché non si arriccino.|Ungile con olio e rosmarino.|Cuocile su piastra ben calda 4-5 minuti per lato e sala alla fine.|Servi con insalata e pomodori conditi.~Toglile dal frigo 20 minuti prima: cuociono in modo più uniforme.`,
`Salsiccia e patate al forno~carne~50~Facile~~Salsiccia:C:600;Patate:F:800;Cipolle:F:1:pz;Rosmarino:F:1:mazzo~Scalda il forno a 200 °C.|Taglia le patate a tocchi e la cipolla a spicchi e condiscile in teglia con olio, sale e rosmarino.|Cuoci 20 minuti, poi aggiungi le salsicce bucherellate.|Cuoci altri 25 minuti, girando a metà, finché tutto è dorato.~Le salsicce rilasciano grasso: non serve molto olio.`,
`Bocconcini di maiale ai peperoni~carne~45~Facile~~Spezzatino di maiale:C:700;Peperoni:F:3:pz;Cipolle:F:1:pz;Passata:D:200~Rosola la carne in padella con olio per 8 minuti e tienila da parte.|Nella stessa padella fai appassire la cipolla, poi unisci i peperoni a falde e cuoci 10 minuti.|Rimetti la carne, aggiungi passata e sale, copri e cuoci 25 minuti a fuoco dolce.|Scopri gli ultimi minuti per restringere il sugo.~Un cucchiaio di aceto a fine cottura rende i peperoni più digeribili.`,
`Arrosto di manzo con patate~carne~80~Media~~Manzo per arrosto:C:1000;Patate:F:800;Rosmarino:F:1:mazzo;Aglio:F:2:spicchi;Vino rosso:D:100:ml~Scalda il forno a 200 °C e metti le patate a tocchi in teglia con olio, sale e rosmarino: cuocile 20 minuti.|Lega la carne e rosolala in padella con olio e aglio su tutti i lati, 8 minuti in totale.|Sfuma con il vino e trasferisci carne e fondo nella teglia con le patate.|Cuoci 30-35 minuti per una carne rosata al centro.|Avvolgi la carne nell’alluminio, lasciala riposare 10 minuti e affettala sottile.~Con il termometro: 55 °C al cuore per l’arrosto rosa.`,
`Spezzatino di manzo con piselli~carne~100~Facile~~Spezzatino di manzo:C:700;Piselli:S:400;Cipolle:F:1:pz;Passata:D:300;Vino rosso:D:100:ml~Rosola la carne in pentola con olio a fuoco vivo, in due volte.|Aggiungi la cipolla affettata e cuoci 3 minuti, poi sfuma con il vino.|Unisci passata, sale e acqua a coprire; copri e cuoci a fuoco basso 60 minuti.|Aggiungi i piselli e cuoci altri 20 minuti.~È ancora più buono il giorno dopo.`,
`Straccetti di manzo ai funghi~carne~20~Facile~G~Fettine di manzo:C:600;Funghi:F:300;Farina:D:30;Aglio:F:1:spicchi;Prezzemolo:F:1:mazzo~Taglia le fettine a striscioline e infarinale leggermente.|Rosola i funghi affettati con olio e aglio per 8 minuti e mettili da parte.|Nella stessa padella, a fuoco vivo, cuoci gli straccetti 2-3 minuti.|Rimetti i funghi, sala e completa con prezzemolo.~Fuoco alto e pochi minuti: la carne resta tenera.`,
`Polpettone al forno con patate~carne~75~Media~GUL~Macinato misto:C:700;Uova:L:2:pz;Pane:P:2:pz;Parmigiano:L:60;Latte:L:100:ml;Patate:F:800;Rosmarino:F:1:mazzo~Scalda il forno a 190 °C e ammolla il pane nel latte.|Impasta il macinato con uova, pane strizzato, parmigiano, sale e pepe.|Forma un filone compatto e mettilo in teglia con le patate a tocchi, olio, sale e rosmarino.|Cuoci 50 minuti, girando le patate a metà.|Lascia riposare 10 minuti prima di affettarlo.~Per una sorpresa metti al centro prosciutto cotto e formaggio.`,
`Spezzatino di vitello con piselli~carne~70~Facile~G~Spezzatino di vitello:C:700;Piselli:S:400;Cipolle:F:1:pz;Farina:D:30;Vino bianco:D:100:ml~Infarina leggermente la carne a cubetti.|Rosolala in pentola con olio e la cipolla affettata per 6 minuti.|Sfuma con il vino, aggiungi un bicchiere d’acqua e sale; copri e cuoci 30 minuti a fuoco dolce.|Unisci i piselli e cuoci altri 20 minuti.~La farina crea un sughetto vellutato, perfetto con il purè.`,
`Scaloppine ai funghi~carne~25~Facile~GL~Fettine di vitello:C:500;Funghi:F:300;Farina:D:40;Burro:L:30;Vino bianco:D:80:ml;Prezzemolo:F:1:mazzo~Rosola i funghi affettati con un filo d’olio per 8 minuti e mettili da parte.|Infarina le fettine e scuotile.|Sciogli il burro e rosola le fettine 2 minuti per lato; sfuma con il vino.|Rimetti i funghi, sala e cuoci 2 minuti; completa con prezzemolo.~Sala solo a fine cottura.`,
`Scaloppine al marsala~carne~20~Facile~GL~Fettine di vitello:C:500;Farina:D:40;Burro:L:40;Marsala:D:100:ml~Infarina le fettine e scuoti la farina in eccesso.|Rosolale nel burro 2 minuti per lato.|Versa il marsala e lascialo evaporare a fuoco vivo 2 minuti, finché si forma una salsa densa.|Sala e servi subito con il fondo.~L’alcol evapora in cottura: resta solo il profumo.`,
`Coniglio alla cacciatora~carne~70~Facile~~Coniglio a pezzi:C:1200;Passata:D:300;Olive:D:80;Rosmarino:F:1:mazzo;Aglio:F:2:spicchi;Vino bianco:D:150:ml~Rosola il coniglio in pentola con olio, aglio e rosmarino per 10 minuti.|Sfuma con il vino bianco.|Aggiungi passata, olive, sale e un bicchiere d’acqua; copri e cuoci a fuoco dolce 45 minuti.|Scopri gli ultimi 10 minuti per restringere il sugo.~Chiedi al macellaio di tagliarlo a pezzi.`,
`Coniglio al forno con patate~carne~80~Facile~~Coniglio a pezzi:C:1200;Patate:F:800;Rosmarino:F:1:mazzo;Aglio:F:3:spicchi;Vino bianco:D:100:ml~Scalda il forno a 190 °C.|Disponi coniglio e patate a tocchi in teglia con olio, aglio, rosmarino, sale e pepe.|Cuoci 20 minuti, poi sfuma con il vino.|Cuoci altri 40 minuti, girando ogni tanto.~Se asciuga troppo aggiungi un mestolino d’acqua calda.`,
`Coniglio con i peperoni~carne~70~Facile~~Coniglio a pezzi:C:1200;Peperoni:F:3:pz;Cipolle:F:1:pz;Vino bianco:D:100:ml~Rosola il coniglio in pentola con olio per 10 minuti e sfuma con il vino.|Aggiungi la cipolla affettata, sale e un bicchiere d’acqua; copri e cuoci 25 minuti.|Unisci i peperoni a falde e cuoci altri 25 minuti.|Scopri e lascia restringere 5 minuti.~È un classico piemontese: ancora più buono con un filo d’aceto alla fine.`,
`Agnello cacio e uova~carne~60~Media~UL~Agnello a pezzi:C:1000;Uova:L:3:pz;Pecorino:L:60;Vino bianco:D:100:ml;Aglio:F:2:spicchi;Rosmarino:F:1:mazzo;Limoni:F:1:pz~Rosola l’agnello in pentola con olio, aglio e rosmarino per 10 minuti.|Sfuma con il vino, aggiungi un bicchiere d’acqua e sale; copri e cuoci 40 minuti.|Sbatti le uova con il pecorino, il succo di limone e pepe.|Spegni il fuoco, versa le uova sulla carne e mescola finché si forma una crema.~Fuoco spento quando aggiungi le uova: devono restare cremose.`,
`Costolette di agnello a scottadito~carne~20~Facile~~Costolette di agnello:C:1000;Rosmarino:F:1:mazzo;Limoni:F:1:pz;Insalata:F:1:cespo~Batti leggermente le costolette e ungile con olio e rosmarino.|Scalda bene una griglia o piastra.|Cuocile 2-3 minuti per lato e sala alla fine.|Servi subito con limone e insalata.~Si mangiano con le mani, bollenti: da qui il nome.`,
`Salmone al cartoccio con pomodorini e olive~pesce~30~Facile~P~Salmone:C:600;Pomodorini:F:300;Olive:D:60;Basilico:F:1:mazzo~Scalda il forno a 200 °C.|Taglia i pomodorini a metà.|Su un foglio di carta forno disponi il salmone, i pomodorini, le olive, basilico, olio e sale; chiudi bene a pacchetto.|Cuoci 18-20 minuti e apri il cartoccio a tavola.~Il cartoccio tiene il pesce morbido e senza odori in cucina.`,
`Salmone in crosta di pistacchi~pesce~25~Facile~PGN~Salmone:C:600;Pistacchi:D:80;Pangrattato:D:30;Limoni:F:1:pz~Scalda il forno a 200 °C.|Trita i pistacchi con il pangrattato, la scorza di limone e un filo d’olio.|Disponi i tranci in teglia e premi sopra la panatura.|Cuoci 12-15 minuti, finché la crosta è dorata.~Puoi usare anche nocciole o mandorle.`,
`Salmone alla piastra con zucchine~pesce~20~Facile~P~Salmone:C:600;Zucchine:F:400;Limoni:F:1:pz~Taglia le zucchine a fette sottili per il lungo e grigliale 2 minuti per lato; condiscile con olio e sale.|Cuoci il salmone sulla piastra calda dal lato della pelle per 5 minuti.|Giralo e cuoci altri 2-3 minuti.|Servi con le zucchine e succo di limone.~Non girarlo troppo presto: la pelle si stacca da sola quando è croccante.`,
`Merluzzo al forno con patate~pesce~45~Facile~P~Merluzzo:C:700;Patate:F:800;Pomodorini:F:200;Prezzemolo:F:1:mazzo;Aglio:F:1:spicchi~Scalda il forno a 200 °C.|Taglia le patate a fette sottili e cuocile in teglia con olio, sale e aglio per 20 minuti.|Adagia sopra il merluzzo con i pomodorini a metà, olio e sale.|Cuoci altri 15 minuti e completa con prezzemolo.~Va bene anche il merluzzo surgelato, scongelato e asciugato.`,
`Orata all’acqua pazza~pesce~35~Facile~P~Orata:C:1200;Pomodorini:F:300;Aglio:F:2:spicchi;Prezzemolo:F:1:mazzo;Peperoncino:F:1:pz~Fai pulire le orate dal pescivendolo.|In una padella larga scalda olio, aglio e peperoncino, poi aggiungi i pomodorini a metà e cuoci 5 minuti.|Adagia le orate, aggiungi un bicchiere d’acqua e sale.|Copri e cuoci 15-20 minuti a fuoco dolce, bagnandole con il sughetto.|Completa con prezzemolo e servi con il pane per la scarpetta.~È un classico napoletano: il sughetto è perfetto anche per condire la pasta.`,
`Branzino al forno con patate~pesce~50~Facile~P~Branzino:C:1200;Patate:F:800;Limoni:F:1:pz;Rosmarino:F:1:mazzo;Aglio:F:1:spicchi~Scalda il forno a 200 °C.|Taglia le patate a fette sottili e cuocile in teglia con olio, sale e rosmarino per 20 minuti.|Riempi la pancia dei branzini con fette di limone, aglio e rosmarino e adagiali sulle patate.|Cuoci altri 20-25 minuti, finché la carne si stacca dalla lisca.~Un branzino da 600 g basta per due persone.`,
`Branzino al cartoccio~pesce~35~Facile~P~Branzino:C:1200;Pomodorini:F:200;Olive:D:60;Capperi:D:20;Prezzemolo:F:1:mazzo~Scalda il forno a 200 °C.|Disponi ogni branzino su un foglio di carta forno con pomodorini, olive, capperi, prezzemolo, olio e sale.|Chiudi bene i cartocci.|Cuoci 25 minuti e servi aprendo il cartoccio a tavola.~Con i filetti invece del pesce intero bastano 15 minuti.`,
`Platessa gratinata al forno~pesce~20~Facile~PG~Platessa:C:600;Pangrattato:D:60;Prezzemolo:F:1:mazzo;Aglio:F:1:spicchi;Limoni:F:1:pz~Scalda il forno a 200 °C.|Mescola pangrattato, prezzemolo e aglio tritati, scorza di limone, olio e sale.|Disponi i filetti in una teglia unta e coprili con la panatura.|Cuoci 12-15 minuti, finché la superficie è dorata.~È un ottimo modo per far mangiare il pesce ai bambini.`,
`Spiedini di gamberi gratinati~pesce~20~Facile~PG~Gamberi:C:600;Pangrattato:D:60;Prezzemolo:F:1:mazzo;Aglio:F:1:spicchi;Limoni:F:1:pz~Scalda il forno a 220 °C con il grill.|Sguscia i gamberi lasciando la coda e infilzali sugli spiedini.|Passali nell’olio e poi nel pangrattato con prezzemolo, aglio e sale.|Cuoci 6-8 minuti, finché sono dorati.|Servi con spicchi di limone.~Si possono cuocere anche sulla piastra, 2 minuti per lato.`,
`Tranci di tonno con pomodorini e capperi~pesce~20~Facile~P~Tonno fresco:C:600;Pomodorini:F:300;Capperi:D:30;Origano:D:2;Aglio:F:1:spicchi~Scalda olio e aglio in padella, aggiungi i pomodorini a metà e i capperi e cuoci 5 minuti.|Sposta il sugo ai lati e scotta i tranci di tonno 1-2 minuti per lato.|Ricopri con il sugo, aggiungi origano e sale e cuoci ancora 2 minuti.~Il tonno cotto troppo diventa stopposo: meglio rosato dentro.`,
`Pesce spada alla ghiotta~pesce~30~Facile~P~Pesce spada:C:700;Pomodorini:F:300;Olive:D:60;Capperi:D:20;Cipolle:F:1:pz;Prezzemolo:F:1:mazzo~Fai appassire la cipolla affettata in olio per 5 minuti.|Aggiungi pomodorini a metà, olive e capperi e cuoci 8 minuti.|Adagia le fette di pesce spada nel sugo, sala, copri e cuoci 4 minuti per lato.|Completa con prezzemolo tritato.~La versione messinese aggiunge pinoli e uvetta.`,
`Seppie con piselli~pesce~50~Facile~P~Seppie:C:800;Piselli:S:400;Cipolle:F:1:pz;Passata:D:200;Vino bianco:D:80:ml~Fatti pulire le seppie e tagliale a striscioline.|Fai appassire la cipolla in olio, aggiungi le seppie e rosolale 5 minuti; sfuma con il vino.|Unisci passata, sale e un bicchiere d’acqua; copri e cuoci 20 minuti.|Aggiungi i piselli e cuoci altri 15 minuti.~Il sugo è ottimo anche per condire gli spaghetti.`,
`Polpo e patate~pesce~70~Media~P~Polpo:C:1000;Patate:F:700;Limoni:F:1:pz;Prezzemolo:F:1:mazzo;Aglio:F:1:spicchi~Immergi il polpo in acqua bollente non salata e cuocilo coperto a fuoco dolce per 45-50 minuti, finché una forchetta entra facilmente.|Lascialo intiepidire nella sua acqua.|Lessa le patate a tocchi in acqua salata per 15 minuti.|Taglia il polpo a pezzi e condiscilo con le patate, olio, limone, aglio e prezzemolo tritati.~Il polpo surgelato è spesso più tenero di quello fresco.`,
`Cozze alla marinara~pesce~25~Facile~PG~Cozze:C:1500;Aglio:F:2:spicchi;Prezzemolo:F:1:mazzo;Pomodorini:F:200;Pane:P:4:pz~Pulisci le cozze raschiando il guscio e togliendo il filamento (bisso).|In una pentola larga scalda olio e aglio, aggiungi i pomodorini a metà e cuoci 3 minuti.|Unisci le cozze, copri e cuoci a fuoco vivo 5-6 minuti, finché si aprono; scarta quelle chiuse.|Completa con prezzemolo e pepe e servi con il pane tostato.~Senza pomodorini e con tanto pepe diventa l’impepata di cozze.`,
`Pasta e lenticchie~legumi~35~Facile~G~Ditalini:D:250;Lenticchie:D:2:lattine;Carote:F:1:pz;Sedano:F:1:pz;Cipolle:F:1:pz;Passata:D:100~Trita carota, sedano e cipolla e falli appassire in pentola con olio per 6 minuti.|Aggiungi passata, lenticchie con il loro liquido e 800 ml d’acqua e porta a bollore.|Cuoci i ditalini direttamente nella minestra per 10 minuti, mescolando spesso.|Lascia riposare 3 minuti e servi con olio a crudo.~Deve restare densa: aggiungi acqua poca alla volta.`,
`Lenticchie in umido~legumi~30~Facile~~Lenticchie:D:3:lattine;Carote:F:1:pz;Sedano:F:1:pz;Cipolle:F:1:pz;Passata:D:200;Alloro:D:1:pz~Trita carota, sedano e cipolla e falli appassire in olio per 8 minuti.|Aggiungi passata, alloro e le lenticchie scolate con un bicchiere d’acqua.|Cuoci 15 minuti a fuoco dolce, finché il sugo si restringe.|Aggiusta di sale e servi con pane o polenta.~Con le lenticchie secche cuocile prima 30-40 minuti in acqua.`,
`Salsiccia e fagioli~carne~35~Facile~~Salsiccia:C:400;Fagioli:D:2:lattine;Passata:D:300;Salvia:F:1:mazzo;Aglio:F:1:spicchi~Rosola la salsiccia a pezzi in pentola con un filo d’olio per 6 minuti.|Aggiungi aglio e salvia, poi la passata, e cuoci 10 minuti.|Unisci i fagioli scolati e cuoci altri 15 minuti a fuoco dolce.|Servi con pane casereccio.~È il piatto unico toscano per eccellenza.`,
`Zuppa di ceci~legumi~35~Facile~G~Ceci:D:2:lattine;Rosmarino:F:1:mazzo;Aglio:F:1:spicchi;Passata:D:100;Carote:F:1:pz;Pane:P:4:pz~Scalda olio con aglio e rosmarino, aggiungi la carota a dadini e cuoci 4 minuti.|Unisci passata, ceci con il loro liquido e 600 ml d’acqua e cuoci 20 minuti.|Frulla metà della zuppa e rimettila in pentola.|Servi con crostini di pane tostato e olio a crudo.~Un cucchiaio di parmigiano grattugiato nel piatto la rende più ricca.`,
`Vignarola~legumi~45~Media~~Fave:S:400;Piselli:S:300;Carciofi:F:4:pz;Lattuga:F:1:cespo;Cipollotti:F:2:pz~Pulisci i carciofi, tagliali a spicchi e mettili in acqua e limone.|Fai appassire i cipollotti affettati in olio, aggiungi i carciofi e un mestolo d’acqua e cuoci 10 minuti.|Unisci fave e piselli e cuoci altri 15 minuti.|Aggiungi la lattuga a striscioline e cuoci 5 minuti; aggiusta di sale.~La versione romana tradizionale aggiunge guanciale rosolato.`,
`Zuppa di legumi e orzo~legumi~45~Facile~G~Legumi misti:D:2:lattine;Orzo perlato:D:150;Carote:F:1:pz;Sedano:F:1:pz;Cipolle:F:1:pz;Passata:D:100~Trita carota, sedano e cipolla e falli appassire in olio per 8 minuti.|Aggiungi passata, orzo sciacquato e 1,2 litri d’acqua e cuoci 20 minuti.|Unisci i legumi scolati e cuoci altri 15 minuti.|Servi con olio a crudo e pepe.~Il giorno dopo è più densa: allungala con un po’ d’acqua.`,
`Frittata di cipolle~uova~30~Facile~UL~Uova:L:6:pz;Cipolle:F:3:pz;Parmigiano:L:40~Affetta sottili le cipolle e falle stufare in padella con olio e un pizzico di sale per 15 minuti.|Sbatti le uova con parmigiano e sale e uniscile alle cipolle.|Cuoci coperto a fuoco basso 6 minuti.|Gira con un piatto e cuoci altri 4 minuti.~Con le cipolle rosse di Tropea è più dolce.`,
`Frittata di asparagi~uova~25~Facile~UL~Uova:L:6:pz;Asparagi:F:400;Parmigiano:L:40~Elimina la parte dura degli asparagi e tagliali a rondelle, tenendo intere le punte.|Cuocili in padella con olio e un goccio d’acqua per 8 minuti.|Versa le uova sbattute con parmigiano e sale e cuoci coperto a fuoco basso 6 minuti.|Gira con un piatto e cuoci altri 4 minuti.~Ottima anche fredda, tagliata a quadretti.`,
`Frittata ai funghi~uova~25~Facile~UL~Uova:L:6:pz;Funghi:F:300;Parmigiano:L:40;Aglio:F:1:spicchi;Prezzemolo:F:1:mazzo~Trifola i funghi affettati in padella con olio e aglio per 8 minuti e aggiungi il prezzemolo.|Sbatti le uova con parmigiano e sale e versale sui funghi.|Cuoci coperto a fuoco basso 6 minuti.|Gira con un piatto e cuoci altri 4 minuti.~Togli l’aglio prima di versare le uova.`,
`Frittata al forno con verdure~uova~35~Facile~UL~Uova:L:6:pz;Zucchine:F:200;Peperoni:F:1:pz;Pomodorini:F:150;Parmigiano:L:40~Scalda il forno a 180 °C.|Taglia le verdure a dadini e saltale in padella con olio per 6 minuti.|Sbatti le uova con parmigiano e sale, uniscile alle verdure e versa in una teglia foderata di carta forno.|Cuoci 20 minuti, finché è gonfia e dorata.~In forno non serve girarla: più facile e meno unta.`,
`Uova alla fiorentina~uova~25~Facile~UL~Uova:L:6:pz;Spinaci:F:600;Parmigiano:L:40;Burro:L:20~Scalda il forno a 200 °C.|Cuoci gli spinaci in padella con il burro finché appassiscono; sala e strizzali.|Disponili in una pirofila, fai 6 incavi e rompi un uovo in ognuno.|Spolvera con parmigiano e cuoci 8-10 minuti, finché l’albume è rappreso.~La versione classica copre gli spinaci con un velo di besciamella.`,
`Piselli e uova~uova~25~Facile~UL~Piselli:S:500;Uova:L:6:pz;Cipolle:F:1:pz;Pecorino:L:40~Fai appassire la cipolla tritata in olio per 4 minuti.|Aggiungi i piselli, un mestolo d’acqua e sale e cuoci 12 minuti.|Sbatti le uova con il pecorino e versale sui piselli.|Mescola a fuoco basso 2 minuti, finché le uova sono cremose.~È il piatto povero di casa, campano e romano: pronto con ciò che c’è.`,
`Frittata di carciofi~uova~35~Facile~UL~Uova:L:6:pz;Carciofi:F:4:pz;Parmigiano:L:40;Aglio:F:1:spicchi;Prezzemolo:F:1:mazzo~Pulisci i carciofi, tagliali a spicchi sottili e cuocili in padella con olio, aglio e un goccio d’acqua per 12 minuti.|Sbatti le uova con parmigiano, prezzemolo e sale.|Versale sui carciofi e cuoci coperto a fuoco basso 6 minuti.|Gira con un piatto e cuoci altri 4 minuti.~Tieni i carciofi in acqua e limone mentre li pulisci: non anneriscono.`,
`Pizza prosciutto e funghi~pizza~30~Facile~GL~Impasto per pizza:P:1000;Passata:D:300;Mozzarella:L:300;Prosciutto cotto:C:150;Funghi:F:200~Scalda il forno al massimo (250 °C).|Stendi l’impasto in due teglie unte d’olio.|Condisci con la passata salata e un filo d’olio e cuoci 8 minuti.|Aggiungi mozzarella, funghi affettati e prosciutto e cuoci altri 6-7 minuti.~Mettere la mozzarella a metà cottura evita che bruci.`,
`Pizza capricciosa~pizza~30~Facile~GL~Impasto per pizza:P:1000;Passata:D:300;Mozzarella:L:300;Prosciutto cotto:C:120;Funghi:F:150;Carciofini sott’olio:D:150;Olive:D:60~Scalda il forno al massimo (250 °C).|Stendi l’impasto in due teglie unte d’olio.|Condisci con la passata salata e cuoci 8 minuti.|Aggiungi mozzarella, prosciutto, funghi, carciofini e olive e cuoci altri 6-7 minuti.~Scola bene i carciofini dall’olio.`,
`Pizza diavola~pizza~30~Facile~GL~Impasto per pizza:P:1000;Passata:D:300;Mozzarella:L:300;Salame piccante:C:120~Scalda il forno al massimo (250 °C).|Stendi l’impasto in due teglie unte d’olio.|Condisci con la passata salata e cuoci 8 minuti.|Aggiungi mozzarella e salame piccante e cuoci altri 6-7 minuti.~Per i bambini fai metà pizza con salame dolce.`,
`Pizza ortolana~pizza~35~Facile~GL~Impasto per pizza:P:1000;Passata:D:300;Mozzarella:L:300;Zucchine:F:200;Melanzane:F:1:pz;Peperoni:F:1:pz~Scalda il forno al massimo (250 °C).|Taglia le verdure a fette sottili e grigliale 2 minuti per lato.|Stendi l’impasto in due teglie unte, condisci con la passata salata e cuoci 8 minuti.|Aggiungi mozzarella e verdure e cuoci altri 6-7 minuti.~Le verdure grigliate prima non rilasciano acqua sulla pizza.`,
`Pizza tonno e cipolla~pizza~30~Facile~GLP~Impasto per pizza:P:1000;Passata:D:300;Mozzarella:L:250;Tonno:D:2:lattine;Cipolle rosse:F:1:pz~Scalda il forno al massimo (250 °C).|Stendi l’impasto in due teglie unte, condisci con la passata salata e la cipolla affettata sottile e cuoci 8 minuti.|Aggiungi mozzarella e tonno sgocciolato e cuoci altri 6-7 minuti.~La cipolla di Tropea è perfetta.`,
`Pizza quattro formaggi~pizza~30~Facile~GL~Impasto per pizza:P:1000;Mozzarella:L:250;Gorgonzola:L:80;Fontina:L:80;Parmigiano:L:40~Scalda il forno al massimo (250 °C).|Stendi l’impasto in due teglie unte d’olio e cuoci 6 minuti in bianco.|Distribuisci mozzarella, gorgonzola e fontina a pezzetti e il parmigiano.|Cuoci altri 7-8 minuti, finché i formaggi sono fusi e dorati.~È una pizza bianca: niente pomodoro.`,
`Pizza crudo, rucola e grana~pizza~30~Facile~GL~Impasto per pizza:P:1000;Passata:D:250;Mozzarella:L:250;Prosciutto crudo:C:120;Rucola:F:80;Parmigiano:L:50~Scalda il forno al massimo (250 °C).|Stendi l’impasto in due teglie unte, condisci con la passata salata e cuoci 8 minuti.|Aggiungi la mozzarella e cuoci altri 6 minuti.|Appena sfornata completa con crudo, rucola e scaglie di grana.~Il crudo va messo a crudo: se cuoce diventa salato e duro.`,
`Calzone prosciutto e mozzarella~pizza~35~Facile~GL~Impasto per pizza:P:1000;Prosciutto cotto:C:150;Mozzarella:L:250;Ricotta:L:200;Passata:D:150~Scalda il forno a 230 °C.|Dividi l’impasto in 4 dischi.|Su metà di ogni disco metti ricotta, prosciutto e mozzarella a cubetti; richiudi a mezzaluna e sigilla bene i bordi.|Spennella con un cucchiaio di passata e olio e cuoci 18-20 minuti.~Bucherella la superficie con una forchetta: non si gonfia troppo.`,
`Piadina crudo, squacquerone e rucola~pizza~10~Facile~GL~Piadine:P:4:pz;Prosciutto crudo:C:120;Squacquerone:L:200;Rucola:F:80~Scalda le piadine in padella 1 minuto per lato.|Spalma lo squacquerone su metà di ogni piadina.|Aggiungi crudo e rucola, piega a metà e servi subito.~Lo squacquerone si può sostituire con stracchino.`,
`Piadina con verdure grigliate e mozzarella~pizza~20~Facile~GL~Piadine:P:4:pz;Zucchine:F:300;Melanzane:F:1:pz;Mozzarella:L:200~Taglia zucchine e melanzana a fette sottili e grigliale 2 minuti per lato; condiscile con olio e sale.|Scalda le piadine in padella 1 minuto per lato.|Farcisci con verdure e mozzarella a fette, piega e scalda ancora 1 minuto per far fondere il formaggio.~Con un filo di pesto diventa ancora più saporita.`,
`Insalata di pollo, mais e pomodorini~insalata~25~Facile~~Petto di pollo:C:400;Insalata mista:F:1:cespo;Mais:D:1:lattina;Pomodorini:F:250~Cuoci il petto di pollo sulla piastra 4 minuti per lato, salalo e taglialo a striscioline.|Lava l’insalata e taglia i pomodorini a metà; scola il mais.|Unisci tutto e condisci con olio, sale e limone o aceto.~Puoi usare il pollo avanzato dall’arrosto.`,
`Insalata greca~insalata~15~Facile~L~Feta:L:200;Pomodori:F:400;Cetrioli:F:2:pz;Olive:D:80;Cipolle rosse:F:1:pz~Taglia pomodori e cetrioli a tocchi e la cipolla ad anelli sottili.|Unisci le olive e la feta a cubetti.|Condisci con olio, sale e origano.~È nata in Grecia ma è di casa anche da noi d’estate.`,
`Insalata di mare~insalata~30~Facile~P~Misto mare:S:800;Sedano:F:2:pz;Limoni:F:2:pz;Prezzemolo:F:1:mazzo;Aglio:F:1:spicchi~Lessa il misto mare in acqua salata per il tempo indicato (di solito 5-8 minuti) e scolalo.|Taglia il sedano a fettine sottili.|Condisci il pesce ancora tiepido con olio, succo di limone, aglio e prezzemolo tritati e il sedano.|Lascia insaporire in frigo almeno 30 minuti.~Togli l’aglio prima di servire se non lo ami.`,
`Insalata di farro con verdure~insalata~35~Facile~G~Farro:D:280;Zucchine:F:200;Pomodorini:F:200;Peperoni:F:1:pz;Basilico:F:1:mazzo~Lessa il farro in acqua salata per il tempo indicato (perlato circa 20 minuti), scolalo e raffreddalo.|Salta zucchine e peperone a dadini in padella con olio per 5 minuti.|Unisci farro, verdure, pomodorini e basilico e condisci con olio e sale.~Aggiungi feta o mozzarella per un piatto unico più ricco.`,
`Insalata di orzo con tonno e verdure~insalata~30~Facile~GP~Orzo perlato:D:280;Tonno:D:1:lattina;Pomodorini:F:200;Zucchine:F:200;Olive:D:60~Lessa l’orzo in acqua salata per 20-25 minuti, scolalo e raffreddalo.|Taglia le zucchine a dadini piccoli e i pomodorini a spicchi.|Mescola tutto con tonno, olive, olio e sale.~Si conserva bene in frigo per due giorni.`,

[`Spaghetti alla carbonara~pasta~25~Media~GUL~Spaghetti:D:320;Guanciale:C:150;Uova:L:4:pz;Pecorino:L:70~Taglia il guanciale a listarelle e rosolalo in padella fredda a fuoco medio per 8 minuti, finché è croccante.|Sbatti in una ciotola le uova con il pecorino e abbondante pepe nero.|Cuoci gli spaghetti in acqua salata, scolali al dente e tieni un mestolo d’acqua di cottura.|Spegni il fuoco, unisci la pasta al guanciale, poi versa il composto di uova mescolando veloce.|Allunga con poca acqua di cottura fino a ottenere una crema e servi subito.~Mai riaccendere il fuoco dopo aver aggiunto le uova: si strapazzano.`,
`Spaghetti cacio e pepe~pasta~20~Media~GL~Spaghetti:D:320;Pecorino:L:120;Pepe nero:D:5~Gratta il pecorino molto fine e mettilo in una ciotola con un poco d’acqua tiepida, fino a ottenere una crema.|Tosta il pepe in padella 1 minuto, poi aggiungi un mestolo d’acqua.|Cuoci gli spaghetti in poca acqua salata e scolali molto al dente.|Saltali nel pepe, spegni il fuoco e manteca con la crema di pecorino, aggiungendo acqua di cottura.|Servi subito, ben cremoso.~Usa acqua tiepida, non bollente, per evitare i grumi.`,
`Tagliatelle al ragù alla bolognese~pasta~120~Media~GUL~Tagliatelle:D:320;Macinato di manzo:C:300;Pancetta:C:80;Carote:F:1:pz;Sedano:F:1:pz;Cipolle:F:1:pz;Passata:D:300;Vino rosso:D:100:ml;Latte:L:100:ml;Parmigiano:L:50~Trita finemente carota, sedano e cipolla e falli appassire in olio con la pancetta a dadini per 8 minuti.|Aggiungi il macinato e rosola a fuoco vivo finché perde l’acqua e si colora, poi sfuma con il vino.|Unisci la passata, un bicchiere d’acqua e sale; copri e cuoci a fuoco bassissimo per 90 minuti, aggiungendo acqua se asciuga; negli ultimi 10 minuti versa il latte.|Cuoci le tagliatelle al dente e saltale nel ragù per un minuto.|Servi con parmigiano grattugiato.~Più cuoce piano, più il ragù viene morbido: non avere fretta.`,
`Risotto alla milanese~riso~40~Media~L~Riso:D:320;Zafferano:D:1:bustina;Burro:L:60;Parmigiano:L:60;Brodo vegetale:D:1:l;Cipolle:F:1:pz~Fai appassire la cipolla tritata con metà del burro per 5 minuti.|Tosta il riso 2 minuti, mescolando.|Aggiungi il brodo caldo un mestolo alla volta e cuoci 16-18 minuti, mescolando spesso.|A metà cottura sciogli lo zafferano in un mestolo di brodo e uniscilo.|Spegni, manteca con burro freddo e parmigiano e lascia riposare 2 minuti.~Il brodo deve essere sempre caldo, altrimenti il riso si ferma.`,
`Pollo arrosto con patate croccanti~carne~70~Facile~~Cosce di pollo:C:800;Patate:F:800;Rosmarino:F:1:mazzo;Aglio:F:2:spicchi;Limoni:F:1:pz~Scalda il forno a 200 °C.|Taglia le patate a tocchi di 3 cm, sciacquale e asciugale bene.|Condisci pollo e patate in teglia con olio, sale, rosmarino e aglio.|Cuoci 50-60 minuti girando a metà; negli ultimi 10 minuti usa il grill per dorare.|Spremi il limone e lascia riposare 5 minuti prima di servire.~Patate asciutte e teglia ampia: non devono toccarsi, così diventano croccanti.`,
`Salmone al forno con limone e zucchine~pesce~30~Facile~P~Salmone:C:500;Limoni:F:2:pz;Prezzemolo:F:1:mazzo;Zucchine:F:400~Scalda il forno a 180 °C.|Appoggia il salmone su carta forno con olio, sale, fette di limone e prezzemolo tritato.|Cuoci 15-18 minuti: il centro deve restare appena rosato.|Intanto salta le zucchine a rondelle in padella con olio per 8 minuti.|Servi il salmone con le zucchine e un filo d’olio a crudo.~Non cuocere troppo: il salmone continua a cuocere fuori dal forno.`,
`Pasta e ceci cremosa~legumi~35~Facile~G~Pasta mista:D:250;Ceci:D:2:lattine;Rosmarino:F:1:mazzo;Passata:D:150;Aglio:F:1:spicchi~Scalda olio con aglio e rosmarino per 2 minuti, poi aggiungi la passata e cuoci 3 minuti.|Unisci i ceci scolati e 600 ml d’acqua e cuoci 10 minuti.|Frulla un mestolo di ceci con un po’ di brodo e rimettilo in pentola per rendere il piatto cremoso.|Cuoci la pasta direttamente nella zuppa per 10 minuti, aggiungendo acqua se serve.|Lascia riposare 3 minuti e servi con olio a crudo.~Mescola spesso: l’amido della pasta rende la zuppa vellutata.`,

`Orecchiette con cime di rapa~pasta~35~Facile~G~Orecchiette:D:320;Cime di rapa:F:800;Aglio:F:2:spicchi;Peperoncino:F:1:pz;Pangrattato:D:40~Pulisci le cime di rapa tenendo foglie e cime tenere.|Cuoci le orecchiette in acqua salata e, dopo 6 minuti, aggiungi le cime nella stessa pentola.|Intanto scalda olio, aglio e peperoncino e tosta il pangrattato in una padellina.|Scola, salta nel condimento e finisci con il pangrattato croccante.~Cuocere pasta e verdura insieme rende il piatto più saporito.`,
`Lasagne alla bolognese~pasta~120~Media~GLU~Sfoglie lasagna:D:250;Macinato di manzo:C:400;Passata:D:500;Besciamella:L:600:ml;Parmigiano:L:80;Carote:F:1:pz;Sedano:F:1:pz;Cipolle:F:1:pz~Prepara il ragù: fai appassire carota, sedano e cipolla tritati, aggiungi il macinato e la passata e cuoci 60 minuti a fuoco basso.|Scalda il forno a 180 °C.|In una teglia alterna ragù, sfoglie, besciamella e parmigiano, in 4 strati.|Finisci con besciamella e parmigiano.|Cuoci in forno per 35 minuti e lascia riposare 10 minuti prima di tagliare.~Il riposo finale tiene insieme gli strati.`,
`Gnocchi alla sorrentina~pasta~30~Facile~GL~Gnocchi:D:600;Passata:D:400;Mozzarella:L:250;Basilico:F:1:mazzo;Parmigiano:L:40~Scalda il forno a 220 °C con il grill.|Cuoci la passata con olio, sale e basilico per 10 minuti.|Lessa gli gnocchi e scolali appena salgono a galla.|Condiscili con il sugo, versali in una pirofila e copri con mozzarella a cubetti e parmigiano.|Gratina in forno per 8-10 minuti, fino a doratura.~Scola bene la mozzarella, altrimenti bagna il piatto.`,

`Risotto alla zucca~riso~40~Facile~L~Riso:D:320;Zucca:F:600;Cipolle:F:1:pz;Burro:L:40;Parmigiano:L:60;Brodo vegetale:D:1:l~Taglia la zucca a dadini e cuocila in padella con un filo d’olio e un mestolo di brodo per 15 minuti, fino a ridurne metà in crema.|Fai appassire la cipolla tritata con il burro, aggiungi il riso e tostalo 2 minuti.|Cuoci il riso con il brodo caldo per 16-18 minuti, unendo la zucca a crema.|Manteca con parmigiano e completa con la zucca rimasta a pezzi.~Schiacciare metà della zucca dà cremosità senza panna.`,
`Saltimbocca alla romana~carne~25~Media~GL~Fettine di vitello:C:500;Prosciutto crudo:C:120;Salvia:F:1:mazzo;Burro:L:30;Farina:D:30;Vino bianco:D:80:ml~Batti le fettine di vitello perché siano sottili.|Su ogni fettina metti una foglia di salvia e una fetta di crudo e fissa con uno stuzzicadenti.|Infarina solo il lato della carne e rosola in padella con il burro 2 minuti per lato, partendo dal prosciutto.|Sfuma con il vino bianco e servi con il fondo di cottura.~Poco sale: il prosciutto è già salato.`,

`Orata al forno con patate~pesce~50~Facile~P~Orata:C:1200;Patate:F:700;Olive:D:60;Prezzemolo:F:1:mazzo;Limoni:F:1:pz~Scalda il forno a 200 °C.|Taglia le patate a fettine sottili, condiscile con olio e sale e cuocile 15 minuti.|Adagia sopra l’orata pulita con limone, prezzemolo e olive.|Cuoci altri 25 minuti, finché la carne si stacca facilmente dalla lisca.~Chiedi al pescivendolo di pulirla: ti fa risparmiare tempo.`,

`Busiate al pesto trapanese~pasta~25~Facile~GLN~Busiate:D:320;Pomodorini:F:400;Mandorle:D:60;Basilico:F:1:mazzo;Aglio:F:1:spicchi;Pecorino:L:50~Immergi i pomodorini 30 secondi in acqua bollente, pelali e tagliali a pezzi.|Frulla pomodorini, mandorle, basilico, aglio, pecorino e olio fino a un pesto rustico.|Cuoci le busiate al dente.|Condisci con il pesto a crudo, allungando con acqua di cottura.~Il pesto va usato crudo: il calore ne spegne il profumo.`,
`Spaghetti alla puttanesca~pasta~25~Facile~GP~Spaghetti:D:320;Passata:D:400;Olive:D:100;Capperi:D:30;Acciughe:C:40;Aglio:F:2:spicchi;Peperoncino:F:1:pz;Prezzemolo:F:1:mazzo~Scalda l’olio con aglio, peperoncino e acciughe finché le acciughe si sciolgono.|Aggiungi olive e capperi, poi la passata, e cuoci 12 minuti.|Cuoci gli spaghetti al dente e saltali nel sugo.|Completa con il prezzemolo tritato.~Poco sale: acciughe, olive e capperi sono già saporiti.`,
`Pasta e patate alla napoletana~pasta~40~Facile~GL~Pasta mista:D:250;Patate:F:600;Provola:L:100;Cipolle:F:1:pz;Sedano:F:1:pz;Passata:D:100~Fai appassire cipolla e sedano tritati con olio per 5 minuti.|Aggiungi le patate a cubetti e la passata e cuoci 5 minuti.|Copri con acqua calda, cuoci 15 minuti, poi unisci la pasta e cuoci altri 10 minuti, mescolando.|A fuoco spento unisci la provola a cubetti e lascia riposare 3 minuti.~Deve restare cremosa, non brodosa: aggiungi l’acqua poco alla volta.`,
`Fave e cicoria~legumi~40~Facile~G~Fave:D:2:lattine;Cicoria:F:700;Aglio:F:1:spicchi;Pane:P:2:pz~Lessa la cicoria in acqua salata per 10-12 minuti e scolala.|Scalda le fave con un mestolo d’acqua e schiacciale con olio e sale in una crema grossolana.|Salta la cicoria in padella con olio e aglio.|Servi la crema di fave con la cicoria e il pane tostato.~Con le fave secche ammollale una notte e cuocile circa un’ora e mezza.`,
`Focaccia barese~pizza~120~Media~G~Farina:D:500;Lievito di birra:D:1:bustina;Pomodorini:F:300;Olive:D:80~Impasta farina, 300 ml d’acqua tiepida, lievito, 10 g di sale e 2 cucchiai d’olio per 10 minuti.|Lascia lievitare un’ora e mezza.|Stendi in una teglia oliata e lascia riposare 20 minuti.|Premi sopra i pomodorini a metà e le olive, condisci con olio e sale.|Cuoci in forno a 220 °C per 25 minuti.~Premi bene i pomodorini: affondano e restano succosi.`,
`Stracciatella alla romana~uova~15~Facile~UL~Uova:L:4:pz;Parmigiano:L:60;Brodo vegetale:D:1:l~Porta a bollore il brodo.|Sbatti le uova con il parmigiano e un pizzico di sale.|Versa il composto nel brodo a filo, mescolando con una forchetta per formare i fiocchi.|Cuoci 2 minuti e servi subito.~Mescola piano e a fuoco medio: se bolle forte i fiocchi si spezzano.`,
`Gnocchi alla romana~pasta~70~Media~GLU~Semolino:D:250;Latte:L:1000:ml;Burro:L:80;Parmigiano:L:100;Uova:L:2:pz~Scalda il latte con sale e 40 g di burro, versa a pioggia il semolino mescolando e cuoci 10 minuti fino a una massa soda.|Fuori dal fuoco unisci metà del parmigiano e i tuorli.|Stendi l’impasto alto 1 cm su un piano bagnato e lascia raffreddare 30 minuti.|Ritaglia dei dischi e disponili in una teglia imburrata, sovrapposti, con burro fuso e parmigiano.|Gratina in forno a 220 °C per 15 minuti.~Più è freddo l’impasto, più è facile ritagliarlo.`,
`Pollo con i peperoni~carne~55~Facile~~Cosce di pollo:C:800;Peperoni:F:3:pz;Cipolle:F:1:pz;Passata:D:200~Rosola il pollo in padella con olio per 10 minuti e tienilo da parte.|Nello stesso fondo fai appassire la cipolla, poi unisci i peperoni a falde e cuoci 10 minuti.|Rimetti il pollo, aggiungi la passata e sale, copri e cuoci a fuoco dolce per 30 minuti.|Servi caldo.~Il giorno dopo è ancora più buono.`,
`Ribollita~legumi~60~Facile~G~Fagioli:D:2:lattine;Cavolo nero:F:400;Carote:F:2:pz;Sedano:F:1:pz;Cipolle:F:1:pz;Pane:P:4:pz;Passata:D:150~Taglia cipolla, carote e sedano a pezzetti e falli appassire in olio per 8 minuti.|Aggiungi il cavolo nero a strisce e la passata e cuoci 5 minuti.|Unisci i fagioli con il loro liquido e un litro d’acqua e cuoci 30 minuti.|Spezzetta il pane raffermo in una pirofila, versaci la zuppa a strati e lascia riposare 10 minuti.|Servi con olio a crudo.~La vera ribollita si fa il giorno dopo: riscaldata diventa densa.`,
`Pappa al pomodoro~legumi~35~Facile~G~Pane:P:4:pz;Pomodori:F:700;Aglio:F:2:spicchi;Basilico:F:1:mazzo~Scalda l’olio con l’aglio schiacciato per 2 minuti.|Aggiungi i pomodori a pezzi e cuoci 15 minuti.|Unisci il pane raffermo a pezzi e 500 ml d’acqua calda e cuoci 15 minuti, mescolando, finché diventa una crema.|Completa con basilico e olio a crudo.~Usa pane toscano raffermo, senza sale.`,
`Tortellini in brodo~pasta~15~Facile~GUL~Tortellini:C:400;Brodo di carne:D:1500:ml;Parmigiano:L:50~Porta a bollore il brodo.|Cuoci i tortellini direttamente nel brodo per il tempo indicato sulla confezione, di solito 3-5 minuti.|Servi in scodella con parmigiano grattugiato.~Con un buon brodo di carne fatto in casa il piatto cambia.`,
`Cotoletta alla milanese~carne~30~Media~GUL~Vitello:C:600;Uova:L:2:pz;Pangrattato:D:150;Burro:L:100;Limoni:F:1:pz~Batti leggermente le cotolette e incidi il bordo per non farle arricciare.|Passale nell’uovo sbattuto con un pizzico di sale e poi nel pangrattato, premendo bene.|Scalda il burro in una padella ampia e cuoci 4 minuti per lato a fuoco medio, finché sono dorate.|Asciuga su carta da cucina e servi con il limone.~Il burro deve spumeggiare ma non bruciare.`,
`Risi e bisi~riso~40~Facile~L~Riso:D:300;Piselli:S:500;Cipolle:F:1:pz;Burro:L:40;Parmigiano:L:50;Brodo vegetale:D:1:l~Fai appassire la cipolla tritata con il burro e un filo d’olio.|Aggiungi i piselli e cuoci 5 minuti.|Unisci il riso e il brodo caldo e cuoci 15 minuti, mescolando, fino a una consistenza all’onda.|Manteca con il parmigiano e servi subito.~Deve restare cremoso, quasi una zuppa.`,
`Trofie al pesto con patate e fagiolini~pasta~30~Facile~GLN~Trofie:D:320;Pesto:D:1:vasetto;Patate:F:250;Fagiolini:F:200~Pela le patate e tagliale a dadini; spunta i fagiolini e tagliali a pezzi.|Porta a bollore acqua salata e cuoci patate e fagiolini per 5 minuti, poi aggiungi le trofie.|Scola tenendo da parte un mestolo d’acqua di cottura.|Condisci con il pesto a fuoco spento, allungando con l’acqua di cottura.~Come in Liguria, verdure e pasta cuociono nella stessa pentola.`,
`Malloreddus alla campidanese~pasta~35~Facile~GL~Malloreddus:D:320;Salsiccia:C:300;Passata:D:400;Pecorino:L:60;Cipolle:F:1:pz~Togli la pelle alla salsiccia e sgranala in padella con un filo d’olio per 5 minuti.|Aggiungi la cipolla tritata e cuoci 5 minuti.|Unisci la passata e cuoci 15 minuti.|Cuoci i malloreddus al dente e saltali nel sugo con il pecorino.~Volendo, un pizzico di zafferano nel sugo è il tocco sardo.`,
`Polenta ai funghi~riso~45~Facile~L~Farina di mais:D:300;Funghi:F:400;Burro:L:40;Formaggio:L:100;Aglio:F:1:spicchi;Prezzemolo:F:1:mazzo~Porta a bollore 1,2 litri d’acqua salata e versa a pioggia la farina di mais mescolando.|Cuoci 40 minuti a fuoco basso, mescolando spesso (con quella istantanea bastano 8 minuti).|Intanto salta i funghi a fettine con olio, aglio e burro per 10 minuti e unisci il prezzemolo.|Servi la polenta con i funghi e il formaggio a scaglie.~Se si indurisce, allungala con un po’ d’acqua calda.`].forEach(x=>{const[n,c,m,d,a,i,s,tip]=x.split('~');R.push({b:n,t:'',n,e:CE[c],c,al:[...a].map(k=>AL[k]),ing:ing(i,n),s:s.split('|'),tmv:+m,dv:d,tip,top:1})});
[`Pasta alla Norma~pasta~35~Facile~GL~Spaghetti:D:320;Melanzane:F:2:pz;Passata:D:400;Aglio:F:1:spicchi;Basilico:F:1:mazzo;Ricotta salata:L:80~Taglia le melanzane a cubetti, cospargile di sale e lasciale 15 minuti, poi asciugale.|Rosolale in abbondante olio finché sono dorate e scolale su carta assorbente.|In una pentola scalda olio con l’aglio, aggiungi la passata e cuoci 12 minuti con un pizzico di sale.|Cuoci gli spaghetti al dente, scolali e saltali nel sugo con metà delle melanzane.|Servi con le melanzane rimaste, basilico spezzato e ricotta salata grattugiata.~Per una versione più leggera cuoci le melanzane in padella con poco olio e un coperchio.`,
`Insalata di arance e finocchi~insalata~15~Facile~~Arance:F:3:pz;Finocchi:F:2:pz;Olive:D:80;Cipolle:F:1:pz~Pela le arance al vivo, eliminando la parte bianca, e tagliale a rondelle.|Affetta i finocchi sottilissimi e la cipolla a velo.|Unisci tutto in una ciotola con le olive.|Condisci con olio extravergine, sale e pepe e lascia riposare 10 minuti.~Metti i finocchi affettati in acqua fredda per 10 minuti: diventano più croccanti.`,
`Friselle con pomodoro e origano~insalata~10~Facile~G~Friselle:P:4:pz;Pomodori:F:500;Origano:D:3;Basilico:F:1:mazzo~Passa le friselle sotto l’acqua per pochi secondi: devono ammorbidirsi senza sfaldarsi.|Strizzale appena e disponile nei piatti.|Taglia i pomodori a pezzetti e condiscili con olio, sale, origano e basilico.|Distribuisci i pomodori sulle friselle e lascia riposare 5 minuti.~Usa pomodori maturi e saporiti: sono l’anima del piatto.`,
`Spaghetti alla Nerano~pasta~30~Media~GL~Spaghetti:D:320;Zucchine:F:600;Provolone:L:100;Parmigiano:L:40;Basilico:F:1:mazzo~Taglia le zucchine a rondelle sottili e rosolale in olio caldo finché sono dorate; scolale.|Tieni da parte metà delle zucchine e schiaccia l’altra metà con un po’ d’acqua di cottura.|Cuoci gli spaghetti molto al dente.|Salta la pasta con le zucchine, aggiungi provolone e parmigiano grattugiati e acqua di cottura mescolando fino a una crema.|Completa con basilico spezzato.~Spegni il fuoco prima di aggiungere i formaggi, così non diventano filanti.`,
`Carne alla pizzaiola~carne~30~Facile~~Fettine di manzo:C:600;Passata:D:400;Aglio:F:2:spicchi;Origano:D:3;Prezzemolo:F:1:mazzo~Scalda olio con l’aglio schiacciato per 2 minuti.|Aggiungi la passata, un pizzico di sale e l’origano e cuoci 10 minuti.|Immergi le fettine nel sugo e cuocile 3-4 minuti per lato, a fuoco medio.|Servi con il sugo e prezzemolo tritato.~Non cuocere troppo la carne: diventa dura.`,
`Rigatoni alla gricia~pasta~25~Facile~GL~Rigatoni:D:320;Guanciale:C:150;Pecorino:L:80;Pepe nero:D:5~Taglia il guanciale a listarelle e rosolalo in padella senza olio per 8-10 minuti, finché è croccante.|Cuoci i rigatoni al dente in acqua salata, tenendo da parte un mestolo di acqua di cottura.|Scola la pasta e saltala nel guanciale con abbondante pepe e un mestolo di acqua.|Spegni il fuoco, aggiungi il pecorino grattugiato e mescola fino a ottenere una crema.~È la carbonara senza uova: il segreto è l’acqua di cottura.`,
`Fagioli all’uccelletto~legumi~30~Facile~~Fagioli:D:3:lattine;Passata:D:300;Salvia:F:1:mazzo;Aglio:F:2:spicchi~Scola e sciacqua i fagioli.|Scalda olio con l’aglio schiacciato e la salvia per 2 minuti.|Aggiungi la passata e cuoci 5 minuti, poi unisci i fagioli.|Cuoci 15 minuti a fuoco dolce, aggiustando di sale e pepe, finché il sugo si restringe.~Serviti con pane tostato sono un piatto unico; ottimi anche come contorno.`,
`Tagliata di manzo con rucola~carne~20~Facile~L~Controfiletto di manzo:C:600;Rucola:F:100;Pomodorini:F:200;Parmigiano:L:60~Togli la carne dal frigo 30 minuti prima di cuocerla.|Scalda bene una padella e cuoci il taglio 3-4 minuti per lato; sala solo alla fine.|Lascia riposare 5 minuti, poi taglia a fette oblique.|Servi su un letto di rucola e pomodorini con scaglie di parmigiano e un filo d’olio.~Il riposo è fondamentale: i succhi restano nella carne.`,
`Passatelli in brodo~pasta~40~Media~GUL~Pangrattato:D:150;Parmigiano:L:150;Uova:L:3:pz;Brodo:D:1500:ml;Limoni:F:1:pz~Impasta pangrattato, parmigiano, uova, scorza di limone grattugiata e un pizzico di sale: l’impasto deve essere compatto ma non secco.|Lascialo riposare 15 minuti.|Porta a bollore il brodo.|Schiaccia l’impasto con l’apposito ferro (o con uno schiacciapatate a fori grandi) direttamente nel brodo.|Cuoci 2-3 minuti, finché i passatelli salgono a galla, e servi.~Se l’impasto è troppo morbido aggiungi pangrattato, se è troppo duro un po’ di brodo.`,
`Pizzoccheri della Valtellina~pasta~40~Media~GL~Pizzoccheri:D:320;Patate:F:300;Verza:F:300;Fontina:L:150;Burro:L:80;Salvia:F:1:mazzo;Aglio:F:1:spicchi~Pulisci la verza e tagliala a listarelle; sbuccia le patate e tagliale a cubetti.|Porta a bollore acqua salata e cuoci patate e verza per 10 minuti.|Aggiungi i pizzoccheri e cuoci altri 10 minuti, poi scola tenendo un po’ di acqua.|In una padella sciogli il burro con aglio e salvia.|Alterna in una pirofila strati di pizzoccheri e formaggio a pezzetti; condisci con il burro fuso, mescola e servi caldo.~Se lo trovi, usa il Valtellina Casera al posto della fontina.`,
`Ossobuco alla milanese~carne~120~Media~GL~Ossobuco di vitello:C:1000;Farina:D:50;Burro:L:50;Vino bianco:D:150:ml;Brodo:D:400:ml;Cipolle:F:1:pz;Limoni:F:1:pz;Prezzemolo:F:1:mazzo;Aglio:F:1:spicchi~Incidi il bordo degli ossibuchi per non farli arricciare e infarinali.|Rosolali nel burro 4 minuti per lato, poi toglili dalla pentola.|Nella stessa pentola appassisci la cipolla, rimetti la carne e sfuma con il vino.|Aggiungi il brodo, copri e cuoci a fuoco dolce 90 minuti, girando ogni tanto.|Prepara la gremolada tritando scorza di limone, prezzemolo e aglio.|Servi l’ossobuco con il fondo di cottura e la gremolada.~Il midollo è la parte più buona: servilo con un cucchiaino.`,
`Fegato alla veneziana~carne~30~Facile~L~Fegato di vitello:C:500;Cipolle:F:4:pz;Prezzemolo:F:1:mazzo;Burro:L:30~Affetta le cipolle sottilissime e falle stufare in olio e burro con un goccio d’acqua per 20 minuti, fino a farle morbide.|Taglia il fegato a striscioline sottili.|Alza il fuoco, aggiungi il fegato e cuoci 3-4 minuti, mescolando.|Sala solo alla fine e completa con prezzemolo tritato.~Non cuocerlo oltre: il fegato diventa duro.`,
`Bigoli in salsa~pasta~30~Facile~GP~Bigoli:D:320;Cipolle:F:3:pz;Acciughe:C:60~Affetta finemente le cipolle e falle stufare in olio con un goccio d’acqua per 20 minuti, finché sono morbidissime.|Aggiungi le acciughe a pezzetti e mescola finché si sciolgono.|Cuoci i bigoli al dente.|Condisci con la salsa e un mestolino di acqua di cottura.~Pochissimo sale: le acciughe sono già salate.`,
`Vitello tonnato~carne~75~Media~UP~Girello di vitello:C:700;Tonno:D:2:lattine;Maionese:D:1:vasetto;Capperi:D:30;Carote:F:1:pz;Sedano:F:1:pz;Cipolle:F:1:pz;Limoni:F:1:pz~Metti il vitello in acqua fredda con carota, sedano e cipolla; porta a bollore e cuoci 50 minuti a fuoco basso.|Lascialo raffreddare nel suo brodo, poi taglialo a fettine sottili.|Frulla il tonno scolato con la maionese, qualche cappero e succo di limone, aggiungendo poco brodo per renderla cremosa.|Disponi le fette in un piatto e coprile con la salsa.|Guarnisci con capperi e lascia riposare 1 ora in frigorifero.~È ancora più buono il giorno dopo.`,
`Farinata di ceci~legumi~50~Facile~~Farina di ceci:D:250;Rosmarino:F:1:mazzo~Sciogli la farina di ceci in 500 ml di acqua fredda mescolando con una frusta e aggiungi un pizzico di sale.|Lascia riposare la pastella almeno 30 minuti e togli la schiuma in superficie.|Scalda il forno al massimo con una teglia unta d’olio.|Versa la pastella (circa 5 mm di spessore), aggiungi il rosmarino e cuoci 15-20 minuti, finché è dorata.|Servila calda con pepe nero.~Più la pastella riposa, più la farinata viene leggera.`,
`Pallotte cacio e ova~uova~40~Media~GUL~Pane raffermo:P:200;Pecorino:L:100;Uova:L:4:pz;Passata:D:400;Prezzemolo:F:1:mazzo;Aglio:F:1:spicchi~Ammolla il pane in acqua, strizzalo bene e sbriciolalo.|Impastalo con uova, pecorino grattugiato, prezzemolo e un pizzico di sale; forma polpettine grandi come una noce.|Rosolale in padella con olio finché sono dorate.|In un’altra padella prepara un sugo semplice con olio, aglio e passata (10 minuti).|Immergi le pallotte nel sugo e cuoci 10 minuti.~Non schiacciarle mentre cuociono: devono restare morbide.`,
`Rigatoni alla ’nduja~pasta~25~Facile~GL~Rigatoni:D:320;’Nduja:C:80;Passata:D:400;Ricotta:L:150;Cipolle:F:1:pz~Soffriggi la cipolla tritata in olio per 5 minuti.|Aggiungi la ’nduja e falla sciogliere a fuoco basso.|Unisci la passata e cuoci 12 minuti.|Cuoci i rigatoni al dente e saltali nel sugo.|Servi con la ricotta a cucchiaiate sopra.~La ’nduja è piccante: dosala secondo i gusti.`,
`Pane frattau~uova~30~Facile~GUL~Pane carasau:P:200;Passata:D:500;Pecorino:L:80;Uova:L:4:pz;Basilico:F:1:mazzo~Prepara un sugo semplice con olio e passata, cuoci 12 minuti e sala.|Passa velocemente i fogli di pane carasau in acqua calda per ammorbidirli.|Componi i piatti a strati: pane, sugo e pecorino grattugiato; ripeti due volte.|Cuoci le uova in camicia o all’occhio di bue e adagiale sopra.|Completa con pepe e basilico.~Il pane deve ammorbidirsi senza sfaldarsi.`,
`Canederli in brodo~pasta~50~Media~GUL~Pane raffermo:P:300;Speck:C:120;Uova:L:3:pz;Latte:L:200:ml;Cipolle:F:1:pz;Prezzemolo:F:1:mazzo;Brodo:D:1500:ml;Farina:D:40~Taglia il pane a cubetti e mettilo in una ciotola.|Rosola cipolla e speck a pezzetti per 5 minuti e uniscili al pane.|Aggiungi le uova sbattute con il latte, il prezzemolo, la farina e un pizzico di sale; mescola e lascia riposare 15 minuti.|Forma palline grandi come un mandarino con le mani umide.|Cuocile nel brodo in leggero bollore per 15 minuti e servi in brodo.~Se si sfaldano in cottura aggiungi un cucchiaio di farina all’impasto.`,
`Zuppa di farro~legumi~50~Facile~G~Farro:D:250;Fagioli:D:2:lattine;Carote:F:1:pz;Sedano:F:1:pz;Cipolle:F:1:pz;Passata:D:200;Rosmarino:F:1:mazzo~Trita cipolla, carota e sedano e falli appassire in olio per 8 minuti.|Aggiungi la passata, i fagioli scolati e il rosmarino.|Copri con 1,2 litri d’acqua e porta a bollore.|Unisci il farro (se è perlato basta sciacquarlo) e cuoci 25 minuti, aggiungendo acqua se serve.|Servi con olio a crudo e pepe.~Frulla un mestolo di fagioli per una zuppa più cremosa.`,
`Frittata di maccheroni~uova~30~Facile~GUL~Maccheroni:D:250;Uova:L:5:pz;Parmigiano:L:60;Pancetta:C:100~Cuoci i maccheroni molto al dente, scolali e lasciali raffreddare.|Sbatti le uova con il parmigiano, pepe e poco sale.|Rosola la pancetta a dadini per 3 minuti.|Unisci pasta e pancetta alle uova e versa tutto in una padella antiaderente oliata.|Cuoci coperto 8 minuti, gira con un piatto e cuoci altri 5 minuti.~È ottima anche fredda: un classico da portare in gita.`,
`Polpette di melanzane~legumi~40~Media~GUL~Melanzane:F:3:pz;Pangrattato:D:100;Pecorino:L:60;Uova:L:2:pz;Prezzemolo:F:1:mazzo;Aglio:F:1:spicchi;Passata:D:300~Taglia le melanzane a cubetti e cuocile in padella con olio finché sono morbide; scolale e lasciale raffreddare.|Schiacciale con la forchetta e uniscile a uova, pecorino, pangrattato, prezzemolo, aglio tritato e un pizzico di sale.|Forma le polpette e passale nel pangrattato.|Cuocile in padella con olio finché sono dorate (4 minuti per lato).|Servile così o completale nella passata per 5 minuti.~Se l’impasto è troppo molle aggiungi un po’ di pangrattato.`,
`Frico con patate~legumi~35~Facile~L~Patate:F:600;Montasio:L:300;Cipolle:F:1:pz~Sbuccia le patate e tagliale a cubetti piccoli; affetta la cipolla.|Rosolale in padella antiaderente con un filo d’olio, coperte, per 15 minuti.|Distribuisci il formaggio a dadini sulle patate.|Schiaccia e cuoci a fuoco medio 8 minuti, finché si forma una crosticina dorata sotto.|Gira come una frittata e cuoci altri 5 minuti.~Montasio, Asiago o un altro formaggio a pasta semidura vanno bene.`,
`Abbacchio al forno con patate~carne~90~Facile~~Agnello:C:1000;Patate:F:1000;Rosmarino:F:1:mazzo;Aglio:F:3:spicchi;Vino bianco:D:100:ml~Scalda il forno a 200 °C.|Disponi l’agnello in una teglia con aglio, rosmarino, olio, sale e pepe.|Cuoci 20 minuti, poi sfuma con il vino.|Aggiungi le patate a tocchi, mescola e cuoci altri 60 minuti, girando ogni tanto.|Servi caldo con il fondo di cottura.~Se la carne scurisce troppo, copri la teglia con alluminio.`

[`Riso al pomodoro~riso~25~Facile~~Riso:D:300;Pomodori:F:600;Basilico:F:1:mazzo~Taglia i pomodori a pezzi e cuoci in una pentola con 3 cucchiai d’olio e un pizzico di sale per 10 minuti, finché si disfano.|Aggiungi il riso e mescola 1 minuto per tostarlo nel sugo.|Copri a filo con acqua calda e cuoci 12-14 minuti a fuoco medio, aggiungendo acqua se serve.|Lascia riposare 2 minuti e completa con basilico e olio a crudo.~Se hai poca fretta, passa i pomodori al passaverdure prima di unire il riso.`,
`Pomodori ripieni di riso~riso~60~Facile~~Pomodori:F:8:pz;Riso:D:200;Basilico:F:1:mazzo~Taglia la calotta ai pomodori e svuotali con un cucchiaino, conservando la polpa.|Tritala e mescolala al riso crudo, con olio, sale e basilico.|Riempi i pomodori fino a tre quarti: il riso gonfiandosi occupa spazio.|Disponili in una teglia con un filo d’olio e rimetti le calotte.|Cuoci in forno a 180 °C per 45 minuti, finché il riso è tenero.~Lasciali intiepidire: sono più buoni tiepidi che bollenti.`,
`Spaghetti al pomodoro fresco~pasta~25~Facile~G~Spaghetti:D:320;Pomodori:F:600;Basilico:F:1:mazzo;Aglio:F:1:spicchi~Taglia i pomodori a pezzetti e cuocili in padella con olio e aglio per 12 minuti, schiacciandoli con il cucchiaio.|Cuoci gli spaghetti al dente.|Salta la pasta nel sugo con un po’ d’acqua di cottura.|Completa con basilico e un filo d’olio a crudo.~Con i pomodori maturi non serve aggiungere zucchero.`,
`Uova al pomodoro~uova~20~Facile~U~Uova:L:6:pz;Pomodori:F:500;Basilico:F:1:mazzo~Taglia i pomodori a pezzetti e cuocili in padella con olio e sale per 10 minuti.|Con il dorso di un cucchiaio fai 6 incavi nel sugo.|Rompi un uovo in ogni incavo, copri e cuoci 5-6 minuti a fuoco basso.|Servi con basilico e pepe.~Per un tuorlo più cremoso cuoci 4 minuti.`,
`Pasta con le zucchine~pasta~25~Facile~G~Pasta:D:320;Zucchine:F:600;Aglio:F:1:spicchi;Basilico:F:1:mazzo~Taglia le zucchine a rondelle e rosolale in padella con olio e aglio per 10 minuti, finché sono dorate.|Schiaccia metà delle zucchine con la forchetta per fare una crema.|Cuoci la pasta al dente e saltala nelle zucchine con un po’ d’acqua di cottura.|Completa con basilico e olio a crudo.~Più le zucchine rosolano, più sono dolci.`,
`Frittata di patate~uova~30~Facile~U~Uova:L:6:pz;Patate:F:600;Cipolle:F:1:pz~Sbuccia le patate e tagliale a fettine sottili; affetta la cipolla.|Cuocile in padella con abbondante olio, coperte, per 15 minuti, finché sono morbide.|Sbatti le uova con un pizzico di sale e uniscile alle patate scolate dall’olio.|Versa tutto nella padella e cuoci 6 minuti a fuoco basso.|Gira la frittata con un piatto e cuoci altri 4 minuti.~Lascia riposare 5 minuti prima di tagliare: si compatta meglio.`,
`Insalata di pomodori e cipolla~insalata~10~Facile~~Pomodori:F:600;Cipolle:F:1:pz;Basilico:F:1:mazzo~Taglia i pomodori a spicchi e la cipolla a fettine sottilissime.|Metti la cipolla 10 minuti in acqua fredda per attenuare il gusto.|Condisci i pomodori con olio, sale e basilico, poi aggiungi la cipolla scolata.~Con un pezzo di pane diventa un piatto unico.`,
`Patate al forno con rosmarino~legumi~60~Facile~~Patate:F:1000;Rosmarino:F:1:mazzo;Aglio:F:2:spicchi~Scalda il forno a 200 °C.|Sbuccia le patate e tagliale a tocchi.|Mescolale in una teglia con olio, sale, aglio e rosmarino.|Cuoci 45-50 minuti, girandole a metà cottura, finché sono dorate e croccanti.~Per una crosticina più croccante lessa le patate 5 minuti prima di infornarle.`
