[`Pasta alla crudaiola~pasta~20~Facile~GL~Pasta:D:320;Pomodorini:F:500;Mozzarella:L:200;Basilico:F:1:mazzo;Aglio:F:1:spicchi~Taglia i pomodorini a metà e condiscili con olio, sale, basilico e aglio a fettine; lasciali insaporire 15 minuti.|Taglia la mozzarella a dadini e scolala bene.|Cuoci la pasta al dente e scolala.|Unisci pasta, pomodorini e mozzarella e mescola: il calore fa fondere appena il formaggio.~Ottima anche fredda, da portare in ufficio.`,
`Pasta al gorgonzola e noci~pasta~15~Facile~GLN~Pasta:D:320;Gorgonzola:L:150;Noci:D:60;Latte:L:100:ml~Cuoci la pasta al dente.|Intanto sciogli il gorgonzola a pezzetti in un pentolino a fuoco basso con il latte, mescolando fino a una crema.|Tosta le noci tritate in padella asciutta per 2 minuti.|Condisci la pasta con la crema e completa con le noci e pepe.~Poco sale: il gorgonzola è già saporito.`,
`Spaghetti alle acciughe e pangrattato~pasta~20~Facile~GP~Spaghetti:D:320;Acciughe:C:50;Pangrattato:D:60;Aglio:F:2:spicchi;Prezzemolo:F:1:mazzo~Tosta il pangrattato in padella con un filo d’olio finché è dorato e croccante; mettilo da parte.|Nella stessa padella fai sciogliere le acciughe con olio e aglio a fuoco basso.|Cuoci gli spaghetti al dente e saltali nella padella con un mestolo d’acqua di cottura.|Servi con il pangrattato croccante e prezzemolo tritato.~È la pasta “povera”: il pangrattato tostato sostituisce il formaggio.`,
`Pasta ricotta e pomodorini~pasta~20~Facile~GL~Pasta:D:320;Ricotta:L:250;Pomodorini:F:400;Basilico:F:1:mazzo;Aglio:F:1:spicchi~Rosola l’aglio in olio, aggiungi i pomodorini tagliati a metà e cuoci 10 minuti, finché si ammorbidiscono.|Cuoci la pasta al dente.|Sciogli la ricotta in una ciotola con un mestolo d’acqua di cottura.|Mescola pasta, sugo e ricotta e completa con basilico.~La ricotta va aggiunta fuori dal fuoco per restare cremosa.`,
`Pasta cremosa ai broccoli~pasta~25~Facile~GL~Pasta:D:320;Broccoli:F:500;Aglio:F:1:spicchi;Parmigiano:L:50~Porta a bollore acqua salata, cuoci i broccoli a cimette per 4 minuti, poi aggiungi la pasta.|Intanto scalda olio con l’aglio in una padella grande.|Scola pasta e broccoli e trasferiscili in padella; schiaccia metà dei broccoli con la forchetta fino a ottenere una crema.|Manteca con parmigiano e un mestolo d’acqua di cottura.~Cuocere i broccoli insieme alla pasta fa risparmiare tempo e pentole.`,
`Gnocchi al pesto e pomodorini~pasta~15~Facile~GLN~Gnocchi:D:600;Pesto:D:1:vasetto;Pomodorini:F:250~Porta a bollore acqua salata.|Cuoci gli gnocchi finché salgono a galla, circa 2 minuti.|Intanto taglia i pomodorini a metà e scaldali 3 minuti in padella con un filo d’olio.|Scola gli gnocchi, uniscili ai pomodorini e al pesto e mescola a fuoco spento.~Il pesto non va mai cotto: aggiungilo sempre a fuoco spento.`,
`Penne al salmone~pasta~20~Facile~GLP~Penne:D:320;Salmone affumicato:C:150;Panna:L:150:ml;Limoni:F:1:pz~Cuoci le penne al dente.|Scalda la panna in padella a fuoco basso con scorza di limone e pepe.|Taglia il salmone a striscioline e uniscilo alla panna per 1 minuto.|Salta la pasta nel sugo con un po’ d’acqua di cottura.~Il salmone va aggiunto alla fine: se cuoce troppo si asciuga.`,
`Spaghetti con tonno e capperi~pasta~15~Facile~GP~Spaghetti:D:320;Tonno:D:2:lattine;Capperi:D:30;Passata:D:300;Aglio:F:1:spicchi~Scalda olio con l’aglio, aggiungi la passata e cuoci 8 minuti.|Unisci il tonno sgocciolato e i capperi e cuoci 2 minuti.|Cuoci gli spaghetti al dente e saltali nel sugo con un po’ d’acqua di cottura.~Sciacqua i capperi sotto l’acqua se sono sotto sale.`,
`Pasta con salsiccia e zucca~pasta~30~Facile~G~Pasta:D:320;Salsiccia:C:300;Zucca:F:500;Cipolle:F:1:pz~Taglia la zucca a dadini piccoli e la cipolla a fettine; rosolale in padella con olio per 10 minuti, finché la zucca si ammorbidisce.|Aggiungi la salsiccia sbriciolata e cuoci 8 minuti.|Cuoci la pasta al dente e saltala nel sugo, aggiungendo acqua di cottura.~Schiaccia qualche pezzo di zucca per ottenere una crema naturale.`,
`Minestra di pasta e piselli~pasta~25~Facile~G~Pasta:D:200;Piselli:S:500;Cipolle:F:1:pz;Passata:D:150~Soffriggi la cipolla tritata in olio per 4 minuti.|Aggiungi i piselli e la passata e cuoci 5 minuti.|Copri con 1 litro d’acqua e porta a bollore.|Cuoci la pasta direttamente nella minestra per 10 minuti, mescolando.|Lascia riposare 3 minuti e servi con olio a crudo.~Usa pasta corta piccola: ditalini o quadrucci.`,
`Straccetti di pollo al limone~carne~15~Facile~G~Petto di pollo:C:500;Limoni:F:2:pz;Farina:D:30;Prezzemolo:F:1:mazzo~Taglia il pollo a striscioline e infarinale leggermente.|Rosola in padella con olio a fuoco vivo per 5 minuti, finché sono dorate.|Aggiungi succo e scorza di limone e cuoci altri 2 minuti.|Completa con prezzemolo tritato.~Bastano pochi minuti: il pollo resta più succoso.`,
`Scaloppine al limone~carne~15~Facile~GL~Fettine di vitello:C:500;Farina:D:40;Burro:L:30;Limoni:F:2:pz~Infarina le fettine e scuotile bene.|Sciogli il burro con un filo d’olio e rosola le fettine 2 minuti per lato.|Aggiungi succo di limone e un mestolo d’acqua e cuoci 2 minuti, finché si forma una cremina.|Servi subito con il fondo di cottura.~Sala solo a fine cottura, altrimenti la carne rilascia acqua.`,
`Salsiccia e broccoli in padella~carne~25~Facile~~Salsiccia:C:500;Broccoli:F:600;Aglio:F:1:spicchi~Lessa i broccoli in acqua salata per 5 minuti e scolali.|Rosola la salsiccia a pezzi in padella con olio e aglio per 8 minuti.|Aggiungi i broccoli e saltali 5 minuti, schiacciandone alcuni.|Servi caldo.~Con un pezzo di pane diventa un piatto unico.`,
`Bocconcini di pollo al curry~carne~20~Facile~L~Petto di pollo:C:500;Curry:D:10;Yogurt bianco:L:125;Cipolle:F:1:pz~Taglia il pollo a bocconcini e rosolalo in padella con olio e la cipolla a fettine per 8 minuti.|Spolvera con il curry e mescola 1 minuto.|Aggiungi lo yogurt e un po’ d’acqua e cuoci 5 minuti, finché si addensa.|Servi con riso bianco o pane.~Per un gusto più delicato usa meno curry.`,
`Involtini di prosciutto e formaggio~carne~15~Facile~L~Prosciutto cotto:C:300;Fontina:L:200~Taglia la fontina a bastoncini.|Avvolgi ogni bastoncino in una fetta di prosciutto cotto.|Cuocili in padella antiaderente 3 minuti girandoli, finché il formaggio comincia a sciogliersi.~Servili con un’insalata verde.`,
`Hamburger di manzo con insalata~carne~20~Facile~G~Macinato di manzo:C:500;Insalata:F:1:cespo;Pomodori:F:300;Pane:P:4:pz~Condisci il macinato con sale e pepe e forma 4 hamburger spessi circa 2 cm.|Cuocili in padella ben calda 4 minuti per lato.|Tosta il pane 1 minuto.|Servi con insalata e pomodori a fette.~Non schiacciare l’hamburger durante la cottura: perderebbe i succhi.`,
`Gamberi al limone e aglio~pesce~10~Facile~P~Gamberi:C:500;Aglio:F:2:spicchi;Limoni:F:1:pz;Prezzemolo:F:1:mazzo~Scalda olio con l’aglio a fettine per 1 minuto.|Aggiungi i gamberi sgusciati e cuoci 1-2 minuti per lato, finché diventano rosa.|Spegni il fuoco, aggiungi succo di limone e prezzemolo tritato.~Cuocili poco: troppa cottura li rende gommosi.`,
`Merluzzo con pomodorini e olive~pesce~20~Facile~P~Merluzzo:C:600;Pomodorini:F:300;Olive:D:80;Capperi:D:20;Aglio:F:1:spicchi~Scalda olio con l’aglio, aggiungi i pomodorini a metà, le olive e i capperi e cuoci 8 minuti.|Adagia i filetti di merluzzo nel sugo.|Copri e cuoci 8 minuti a fuoco dolce, senza girare.~Se il merluzzo è surgelato scongelalo prima e asciugalo bene.`,
`Filetti di platessa al limone~pesce~15~Facile~GP~Platessa:C:600;Limoni:F:2:pz;Farina:D:30;Prezzemolo:F:1:mazzo~Infarina leggermente i filetti.|Cuocili in padella con olio caldo 3 minuti per lato.|Aggiungi succo di limone e cuoci 1 minuto.|Servi con prezzemolo tritato.~I filetti sottili si cuociono in fretta: girali una sola volta.`,
`Tonno scottato in crosta di sesamo~pesce~10~Facile~P~Tonno fresco:C:500;Sesamo:D:50;Insalata:F:1:cespo~Passa i tranci di tonno nel sesamo premendo bene.|Scalda bene una padella con poco olio.|Scotta il tonno circa 1 minuto e mezzo per lato: dentro deve restare rosato.|Taglialo a fette e servilo su insalata condita con olio e sale.~Il tonno fresco va cotto pochissimo, altrimenti si asciuga.`,
`Crema di ceci con crostini~legumi~10~Facile~G~Ceci:D:2:lattine;Pane:P:4:pz;Aglio:F:1:spicchi;Limoni:F:1:pz~Scola i ceci, tieni da parte un cucchiaio e frulla il resto con aglio, succo di limone, olio e un po’ d’acqua fino a una crema.|Tosta il pane a fette in padella o nel tostapane.|Servi la crema con i ceci interi, olio e pepe sui crostini.~Aggiungi una punta di cumino o paprika per un gusto diverso.`,
`Spinaci e ceci in padella~legumi~15~Facile~~Ceci:D:2:lattine;Spinaci:F:500;Aglio:F:1:spicchi~Scalda olio con l’aglio e aggiungi gli spinaci: cuoci 4 minuti finché appassiscono.|Unisci i ceci scolati e cuoci 6 minuti, schiacciandone qualcuno.|Aggiusta di sale e pepe e servi con pane.~Con gli spinaci surgelati serve qualche minuto in più.`,
`Insalata di lenticchie, pomodori e feta~insalata~10~Facile~L~Lenticchie:D:2:lattine;Pomodori:F:300;Feta:L:150;Cipolle:F:1:pz;Prezzemolo:F:1:mazzo~Scola e sciacqua le lenticchie.|Taglia pomodori a dadini, cipolla a fettine sottili e feta a cubetti.|Mescola tutto con olio, sale e prezzemolo.~Una spruzzata di aceto la rende ancora più fresca.`,
`Frittata di spinaci~uova~15~Facile~UL~Uova:L:6:pz;Spinaci:F:400;Parmigiano:L:40~Cuoci gli spinaci in padella con un filo d’olio finché appassiscono; strizzali se rilasciano acqua.|Sbatti le uova con parmigiano e sale e uniscile agli spinaci.|Cuoci coperto a fuoco basso 6 minuti.|Gira con un piatto e cuoci altri 3 minuti.~Con gli spinaci surgelati scongelali e strizzali bene.`,
`Uova strapazzate con zucchine~uova~15~Facile~U~Uova:L:6:pz;Zucchine:F:300~Taglia le zucchine a dadini e rosolale in padella con olio per 8 minuti.|Sbatti le uova con sale e pepe e versale sulle zucchine.|Mescola dolcemente a fuoco basso 2-3 minuti, finché sono cremose.~Toglile dal fuoco quando sono ancora un po’ umide: finiscono di cuocersi nel piatto.`,
`Wrap di pollo e insalata~pizza~15~Facile~GL~Piadine:P:4:pz;Petto di pollo:C:300;Insalata:F:1:cespo;Pomodori:F:200;Yogurt bianco:L:125~Taglia il pollo a striscioline e cuocilo in padella con olio e sale per 6 minuti.|Scalda le piadine 1 minuto per lato.|Farcisci con pollo, insalata, pomodori e un cucchiaio di yogurt.|Arrotola e taglia a metà.~Si può preparare in anticipo e portare con sé.`,
`Pizza in padella veloce~pizza~25~Facile~GL~Farina:D:300;Yogurt bianco:L:125;Lievito istantaneo:D:1:bustina;Passata:D:200;Mozzarella:L:200;Basilico:F:1:mazzo~Impasta farina, yogurt, lievito istantaneo, 3 cucchiai d’olio e un pizzico di sale, aggiungendo poca acqua se serve, fino a un impasto morbido.|Dividilo in 4 e stendi dei dischi spessi circa 5 mm.|Cuocili in padella antiaderente 3 minuti per lato.|Condisci con passata e mozzarella a pezzetti, copri e cuoci 4 minuti finché il formaggio fonde.|Servi con basilico.~Non serve lievitazione: è pronta in 25 minuti.`,
`Insalata di pasta alla caprese~insalata~15~Facile~GL~Pasta:D:300;Pomodorini:F:300;Mozzarella:L:200;Basilico:F:1:mazzo;Olive:D:60~Cuoci la pasta al dente, scolala e raffreddala sotto l’acqua fredda.|Taglia pomodorini e mozzarella a pezzetti.|Mescola tutto con basilico, olive, olio e sale.~Meglio con pasta corta, come fusilli o farfalle.`,
`Insalata di ceci e tonno~insalata~10~Facile~P~Ceci:D:2:lattine;Tonno:D:2:lattine;Cipolle:F:1:pz;Prezzemolo:F:1:mazzo;Limoni:F:1:pz~Scola e sciacqua ceci e tonno.|Affetta la cipolla sottilissima e tienila 5 minuti in acqua fredda.|Mescola tutto con olio, succo di limone, sale e prezzemolo.~Dopo 15 minuti di riposo è ancora più buona.`,
`Crema di piselli e menta~legumi~20~Facile~L~Piselli:S:600;Cipolle:F:1:pz;Menta:F:1:mazzo;Parmigiano:L:30~Soffriggi la cipolla tritata in olio per 4 minuti.|Aggiungi i piselli e 500 ml d’acqua e cuoci 10 minuti.|Frulla con la menta fino a una crema liscia, regolando di sale e densità con acqua.|Servi con olio a crudo e parmigiano.~Ottima anche fredda.`,
`Vellutata di zucca e patate~legumi~30~Facile~~Zucca:F:800;Patate:F:300;Cipolle:F:1:pz~Taglia zucca e patate a dadini e affetta la cipolla.|Fai appassire la cipolla in olio per 3 minuti, poi aggiungi zucca e patate.|Copri d’acqua, sala e cuoci 20 minuti, finché sono morbide.|Frulla fino a una crema liscia e servi con olio a crudo.~Per una consistenza più densa usa meno acqua.`

[`Pasta al forno~pasta~70~Media~GL~Rigatoni:D:400;Macinato misto:C:300;Passata:D:700;Mozzarella:L:250;Parmigiano:L:80;Cipolle:F:1:pz;Basilico:F:1:mazzo~Fai appassire la cipolla tritata in olio, aggiungi il macinato e rosolalo 8 minuti.|Unisci passata, basilico e sale e cuoci 25 minuti a fuoco dolce.|Scalda il forno a 200 °C e cuoci i rigatoni molto al dente (3 minuti meno del tempo indicato).|Condisci la pasta con il sugo, metà della mozzarella a cubetti e metà del parmigiano e versala in una pirofila.|Copri con il resto di mozzarella e parmigiano e cuoci 20 minuti, finché fa la crosticina.~Si prepara anche la sera prima: in forno direttamente dal frigo, 10 minuti in più.`,
`Cannelloni ricotta e spinaci~pasta~70~Media~GUL~Cannelloni:D:250;Ricotta:L:400;Spinaci:F:500;Parmigiano:L:80;Besciamella:L:500:ml;Passata:D:300~Cuoci gli spinaci in padella finché appassiscono, strizzali bene e tritali.|Mescolali con ricotta, metà del parmigiano, sale e una grattata di noce moscata.|Scalda il forno a 190 °C e stendi metà della passata sul fondo di una pirofila.|Riempi i cannelloni con un sac à poche o un cucchiaino e disponili in fila.|Coprili con besciamella, il resto della passata e parmigiano e cuoci 30 minuti.~Con i cannelloni secchi metti abbondante sugo: devono cuocere in forno.`,
`Linguine ai frutti di mare~pasta~40~Media~GP~Linguine:D:320;Cozze:C:500;Vongole:C:500;Gamberi:C:200;Calamari:C:200;Pomodorini:F:200;Aglio:F:2:spicchi;Prezzemolo:F:1:mazzo;Vino bianco:D:80:ml~Pulisci le cozze e sciacqua le vongole; taglia i calamari ad anelli e sguscia i gamberi.|Apri cozze e vongole in una pentola coperta con olio e aglio a fuoco vivo (5 minuti); filtra il liquido e tieni da parte.|In una padella larga rosola i calamari con olio e aglio 3 minuti, sfuma con il vino e aggiungi i pomodorini a metà.|Cuoci le linguine 2 minuti meno del tempo indicato e finisci la cottura in padella con il liquido delle cozze.|Unisci gamberi, cozze e vongole negli ultimi 2 minuti e completa con prezzemolo.~Niente formaggio: con il pesce si usa un filo d’olio a crudo.`,
`Pasta con le sarde~pasta~45~Media~GPN~Bucatini:D:320;Sarde:C:400;Finocchietto selvatico:F:1:mazzo;Cipolle:F:1:pz;Uvetta:D:30;Pinoli:D:30;Acciughe:C:20;Zafferano:D:1:bustina;Pangrattato:D:50~Lessa il finocchietto 10 minuti in abbondante acqua salata, scolalo (tieni l’acqua per la pasta) e tritalo.|Fai appassire la cipolla in olio, sciogli le acciughe e unisci uvetta ammollata e pinoli.|Aggiungi le sarde pulite a pezzi, il finocchietto e lo zafferano sciolto in un po’ d’acqua; cuoci 10 minuti.|Cuoci i bucatini nell’acqua del finocchietto e saltali nel condimento.|Completa con il pangrattato tostato in padella.~È il simbolo di Palermo: dolce, sapida e profumata.`,
`Pici all’aglione~pasta~45~Facile~G~Pici:D:400;Passata:D:600;Aglio:F:6:spicchi;Peperoncino:F:1:pz~Sbuccia l’aglio, taglialo a fettine e fallo stufare in olio a fuoco bassissimo per 10 minuti, senza farlo colorire.|Aggiungi peperoncino e passata, sala e cuoci 25 minuti, schiacciando l’aglio fino a farlo sciogliere nel sugo.|Cuoci i pici al dente (sono spessi, servono 12-15 minuti).|Salta la pasta nel sugo con un po’ d’acqua di cottura.~L’aglione della Valdichiana è dolce e delicato: si può usare aglio normale, un po’ meno.`,
`Spaghetti all’assassina~pasta~30~Media~G~Spaghetti:D:320;Passata:D:500;Aglio:F:2:spicchi;Peperoncino:F:1:pz~Allunga 200 g di passata con 600 ml d’acqua calda salata e tienila in caldo: è il “brodo”.|In una padella di ferro larga scalda abbondante olio con aglio e peperoncino, poi aggiungi la passata rimasta e lasciala restringere.|Disponi gli spaghetti crudi nella padella e lasciali abbrustolire, girandoli.|Aggiungi il brodo un mestolo alla volta, come per un risotto, finché la pasta è cotta (circa 15 minuti).|Lasciali attaccare un po’ sul fondo: le parti croccanti sono il bello del piatto.~Ricetta di Bari: più bruciacchiati sono, più sono “assassini”.`,
`Pasta alla genovese~pasta~180~Media~GL~Ziti:D:320;Manzo per brasato:C:600;Cipolle:F:1500;Carote:F:1:pz;Sedano:F:1:pz;Vino bianco:D:150:ml;Parmigiano:L:60~Affetta sottili le cipolle e trita carota e sedano.|Rosola la carne a pezzi in pentola con olio per 8 minuti.|Aggiungi tutte le verdure, sale e un mestolo d’acqua; copri e cuoci a fuoco bassissimo per 2 ore e mezza, mescolando ogni tanto.|Scopri, sfuma con il vino e lascia asciugare finché le cipolle sono una crema ambrata.|Spezza gli ziti, cuocili al dente e condiscili con il sugo e il parmigiano; la carne si serve come secondo.~Nonostante il nome è napoletanissima.`,
`Supplì al telefono~riso~80~Media~GUL~Riso:D:300;Passata:D:400;Mozzarella:L:150;Parmigiano:L:50;Uova:L:2:pz;Pangrattato:D:150;Brodo vegetale:D:1:l~Cuoci il riso con la passata e il brodo come un risotto per 16 minuti, manteca con il parmigiano e lascialo raffreddare completamente.|Taglia la mozzarella a bastoncini.|Con le mani umide forma dei cilindri di riso con un pezzo di mozzarella al centro.|Passali nell’uovo sbattuto e poi nel pangrattato.|Friggili in olio caldo (170 °C) 4-5 minuti finché sono dorati, oppure in forno a 200 °C per 20 minuti.~Il nome viene dalla mozzarella che, filando, sembra il filo del telefono.`,
`Brasato al vino rosso~carne~180~Media~~Manzo per brasato:C:1200;Vino rosso:D:750:ml;Carote:F:2:pz;Sedano:F:1:pz;Cipolle:F:1:pz;Rosmarino:F:1:mazzo;Aglio:F:1:spicchi~La sera prima marina la carne nel vino con verdure a pezzi, aglio e rosmarino.|Scola la carne, asciugala e rosolala in pentola con olio su tutti i lati.|Aggiungi verdure e vino della marinata, sale e pepe; copri e cuoci a fuoco bassissimo per 2 ore e mezza.|Togli la carne e frulla il fondo con le verdure per ottenere la salsa.|Affetta il brasato e servilo con la salsa, meglio con polenta o purè.~In Piemonte si usa il Barolo; va bene un buon rosso corposo.`,
`Involtini di carne alla siciliana~carne~45~Media~GLN~Fettine di manzo:C:600;Pangrattato:D:100;Pecorino:L:50;Pinoli:D:30;Uvetta:D:30;Cipolle:F:1:pz~Mescola pangrattato, pecorino, pinoli, uvetta ammollata, prezzemolo e un filo d’olio.|Batti le fettine, distribuisci il ripieno e arrotolale.|Infilzale su spiedini alternandole con spicchi di cipolla e foglie di alloro.|Passale nell’olio e nel pangrattato e cuocile in forno a 200 °C per 15 minuti o sulla griglia 4 minuti per lato.~A Palermo si chiamano braciolette e si fanno anche col pesce spada.`,
`Melanzane ripiene~legumi~60~Media~GUL~Melanzane:F:4:pz;Pane raffermo:P:100;Parmigiano:L:60;Uova:L:1:pz;Passata:D:300;Basilico:F:1:mazzo;Mozzarella:L:150~Scalda il forno a 190 °C.|Taglia le melanzane a metà, svuotale lasciando 1 cm di polpa e cuoci i gusci in forno 15 minuti.|Trita la polpa e saltala in padella con olio 8 minuti; uniscila a pane ammollato e strizzato, parmigiano, uovo, basilico e sale.|Riempi i gusci, coprili con passata e mozzarella a dadini.|Cuoci 25 minuti, finché sono dorate.~Sono buone anche a temperatura ambiente, il giorno dopo.`,
`Peperoni ripieni~carne~70~Media~GUL~Peperoni:F:4:pz;Macinato misto:C:400;Pane raffermo:P:80;Uova:L:1:pz;Parmigiano:L:50;Passata:D:200~Scalda il forno a 190 °C.|Taglia i peperoni a metà per il lungo ed elimina semi e filamenti.|Impasta macinato, pane ammollato e strizzato, uovo, parmigiano, sale e pepe.|Riempi i peperoni, disponili in teglia con un cucchiaio di passata sopra ciascuno e un filo d’olio.|Cuoci 45 minuti, coprendo con alluminio se scuriscono troppo.~Usa peperoni grandi e carnosi, gialli e rossi.`,
`Torta salata ricotta e spinaci~pizza~50~Facile~GUL~Pasta sfoglia:P:2:rotoli;Spinaci:F:600;Ricotta:L:250;Uova:L:2:pz;Parmigiano:L:50~Scalda il forno a 190 °C.|Cuoci gli spinaci in padella finché appassiscono, strizzali bene e tritali.|Mescolali con ricotta, uova, parmigiano, sale e noce moscata.|Fodera una teglia con un rotolo di sfoglia, versa il ripieno e copri con il secondo rotolo, sigillando i bordi.|Bucherella la superficie e cuoci 35 minuti, finché è dorata.~È la cugina facile della torta pasqualina ligure.`,
`Gnocchi di patate al pomodoro~pasta~70~Media~G~Patate:F:1000;Farina:D:300;Passata:D:500;Basilico:F:1:mazzo;Aglio:F:1:spicchi~Lessa le patate con la buccia per 30-40 minuti, sbucciale e schiacciale ancora calde.|Impasta velocemente con la farina e un pizzico di sale, senza lavorare troppo.|Forma dei filoncini, tagliali a pezzetti di 2 cm e passali sui rebbi di una forchetta.|Intanto prepara un sugo con olio, aglio, passata e basilico (15 minuti).|Cuoci gli gnocchi in acqua salata, scolali appena salgono a galla e condiscili.~Patate vecchie e farinose: gli gnocchi vengono più leggeri.`,
`Polenta concia~riso~50~Facile~L~Farina di mais:D:300;Fontina:L:200;Burro:L:60;Parmigiano:L:50~Porta a bollore 1,2 litri d’acqua salata e versa a pioggia la farina mescolando con una frusta.|Cuoci 40 minuti a fuoco basso, mescolando spesso (con quella istantanea bastano 8 minuti).|Fuori dal fuoco aggiungi la fontina a dadini e il parmigiano, mescolando finché fondono.|Fai dorare il burro in un pentolino e versalo sopra la polenta.~È un piatto di montagna: tra Valle d’Aosta e Biellese.`,
`Tiella barese riso, patate e cozze~riso~75~Media~PL~Riso:D:300;Patate:F:600;Cozze:C:1000;Pomodorini:F:300;Cipolle:F:1:pz;Pecorino:L:50;Prezzemolo:F:1:mazzo;Aglio:F:1:spicchi~Apri le cozze a crudo con un coltellino lasciandole nel mezzo guscio e filtra la loro acqua.|Scalda il forno a 200 °C e ungi una teglia.|Fai uno strato di cipolla, patate a fettine sottili e pomodorini; poi riso crudo, cozze, pecorino, prezzemolo e aglio tritati.|Copri con altre patate, pomodorini e pecorino.|Versa l’acqua delle cozze più acqua fino a filo, condisci con olio e cuoci 50 minuti.~Se aprire le cozze ti sembra difficile, falle aprire 2 minuti in pentola e usa l’acqua di cottura filtrata.`,
`Ciambotta~legumi~50~Facile~~Melanzane:F:1:pz;Peperoni:F:2:pz;Patate:F:400;Zucchine:F:300;Pomodori:F:400;Cipolle:F:1:pz;Basilico:F:1:mazzo~Taglia tutte le verdure a tocchi.|Fai appassire la cipolla in olio, poi aggiungi patate e peperoni e cuoci 10 minuti.|Unisci melanzana e zucchine, poi i pomodori a pezzi; sala.|Copri e cuoci 25 minuti a fuoco dolce, mescolando ogni tanto.|Completa con basilico: si mangia calda o tiepida con il pane.~È lo stufato di verdure del Sud, tra Basilicata, Calabria e Campania.`,
`Tortelli di zucca burro e salvia~pasta~15~Facile~GUL~Tortelli di zucca:L:500;Burro:L:60;Salvia:F:1:mazzo;Parmigiano:L:50~Porta a bollore abbondante acqua salata.|Cuoci i tortelli per il tempo indicato, scolandoli delicatamente con una schiumarola.|Intanto sciogli il burro con la salvia a fuoco dolce.|Condisci con il burro e abbondante parmigiano.~A Mantova il ripieno ha anche amaretti e mostarda.`,
`Ravioli ricotta e spinaci al pomodoro~pasta~25~Facile~GUL~Ravioli ricotta e spinaci:L:500;Passata:D:400;Basilico:F:1:mazzo;Parmigiano:L:40~Prepara il sugo con olio, passata, sale e basilico e cuocilo 15 minuti.|Cuoci i ravioli in acqua salata per il tempo indicato.|Scolali delicatamente e condiscili con il sugo.|Completa con parmigiano grattugiato.~Con il burro e salvia sono altrettanto buoni.`,
`Focaccia genovese~pizza~150~Media~G~Farina:D:500;Lievito di birra:D:1:bustina~Impasta farina, 320 ml d’acqua tiepida, lievito, 10 g di sale e 3 cucchiai d’olio per 10 minuti.|Lascia lievitare coperto un’ora e mezza.|Stendi in una teglia ben oliata con le dita e lascia riposare altri 30 minuti.|Fai dei buchi con i polpastrelli e versa sopra un’emulsione di 4 cucchiai d’olio e 4 d’acqua con un pizzico di sale grosso.|Cuoci a 230 °C per 18-20 minuti.~I buchi con le dita trattengono l’olio: è il segreto della fügassa.`,
`Pasta e piselli alla napoletana~pasta~35~Facile~GL~Pasta mista:D:250;Piselli:S:500;Cipolle:F:1:pz;Pancetta:C:80;Parmigiano:L:40~Rosola la cipolla tritata e la pancetta a dadini in olio per 5 minuti.|Aggiungi i piselli, sale e 800 ml d’acqua e cuoci 10 minuti.|Cuoci la pasta direttamente nella minestra, mescolando spesso, per 10 minuti.|A fuoco spento manteca con il parmigiano: deve restare densa.~Come pasta e patate, si “azzecca”: densa e cremosa.`,
`Saltimbocca di pollo~carne~20~Facile~GL~Petto di pollo:C:600;Prosciutto crudo:C:100;Salvia:F:1:mazzo;Farina:D:30;Burro:L:30;Vino bianco:D:80:ml~Taglia il petto a fettine sottili e battile.|Su ognuna metti una foglia di salvia e mezza fetta di crudo, fissando con uno stecchino.|Infarina solo il lato della carne e rosola nel burro 2 minuti per lato, partendo dal prosciutto.|Sfuma con il vino e servi con il fondo di cottura.~Versione veloce ed economica dei saltimbocca alla romana.`

[`Alici gratinate al forno~pesce~25~Facile~PG~Alici:C:600;Pangrattato:D:60;Prezzemolo:F:1:mazzo;Aglio:F:1:spicchi;Limoni:F:1:pz~Fai pulire le alici aperte a libro, senza testa e lisca.|Scalda il forno a 200 °C e disponile in una teglia unta, una accanto all’altra.|Coprile con pangrattato, prezzemolo e aglio tritati, sale, olio e scorza di limone.|Cuoci 12-15 minuti, finché la superficie è dorata.~Pesce azzurro: costa poco ed è ricchissimo di omega 3.`,
`Calamari ripieni~pesce~50~Media~PGU~Calamari:C:800;Pangrattato:D:80;Uova:L:1:pz;Prezzemolo:F:1:mazzo;Aglio:F:1:spicchi;Passata:D:300~Pulisci i calamari tenendo intere le sacche e trita i tentacoli.|Rosola i tentacoli con olio e aglio 3 minuti e uniscili a pangrattato, uovo, prezzemolo e sale.|Riempi le sacche per due terzi e chiudile con uno stecchino.|Rosolali in padella, aggiungi la passata e un po’ d’acqua, copri e cuoci 25 minuti a fuoco dolce.~Non riempirli troppo: in cottura si restringono e il ripieno uscirebbe.`,
`Baccalà in umido con patate~pesce~45~Facile~P~Baccalà dissalato:C:700;Patate:F:600;Passata:D:400;Olive:D:60;Capperi:D:20;Cipolle:F:1:pz~Fai appassire la cipolla affettata in olio per 5 minuti.|Aggiungi passata, olive, capperi e le patate a tocchi con un bicchiere d’acqua; cuoci coperto 15 minuti.|Adagia il baccalà a pezzi e cuoci altri 15 minuti senza mescolare.|Assaggia prima di salare: il baccalà è già sapido.~Compralo già dissalato: altrimenti va tenuto in acqua fredda 2-3 giorni.`,
`Sgombro alla mediterranea~pesce~25~Facile~P~Sgombro:C:800;Pomodorini:F:300;Olive:D:60;Capperi:D:20;Origano:D:2~Scalda il forno a 200 °C.|Disponi i filetti di sgombro in una teglia con i pomodorini a metà, olive e capperi.|Condisci con olio, sale e origano.|Cuoci 15-18 minuti.~Lo sgombro è economico e saporito: perfetto per chi inizia con il pesce azzurro.`,
`Bastoncini di merluzzo fatti in casa~pesce~25~Facile~PGU~Merluzzo:C:600;Uova:L:2:pz;Pangrattato:D:150;Limoni:F:1:pz~Taglia i filetti di merluzzo a bastoncini.|Passali nell’uovo sbattuto con un pizzico di sale e poi nel pangrattato.|Cuocili in forno a 200 °C per 15 minuti, o in padella con olio 2-3 minuti per lato.|Servi con spicchi di limone.~Piacciono ai bambini molto più di quelli surgelati.`,
`Gamberi e zucchine in padella~pesce~20~Facile~P~Gamberi:C:500;Zucchine:F:400;Aglio:F:1:spicchi;Prezzemolo:F:1:mazzo;Limoni:F:1:pz~Taglia le zucchine a julienne o a rondelle sottili.|Saltale in padella con olio e aglio per 6 minuti a fuoco vivo.|Aggiungi i gamberi sgusciati e cuoci 2-3 minuti.|Completa con prezzemolo, scorza di limone e sale.~Ottimo anche per condire la pasta.`,
`Trota salmonata al cartoccio~pesce~30~Facile~P~Trota salmonata:C:800;Limoni:F:1:pz;Prezzemolo:F:1:mazzo;Zucchine:F:300~Scalda il forno a 200 °C.|Disponi i filetti di trota su carta forno con zucchine a rondelle sottili, fette di limone, prezzemolo, olio e sale.|Chiudi bene i cartocci.|Cuoci 18-20 minuti.~Pesce di lago, delicato e con poche spine.`,
`Polpette di tonno~pesce~30~Facile~PGUL~Tonno:D:3:lattine;Patate:F:300;Uova:L:1:pz;Parmigiano:L:40;Pangrattato:D:80;Prezzemolo:F:1:mazzo~Lessa le patate e schiacciale.|Unisci tonno sgocciolato, uovo, parmigiano, prezzemolo e metà del pangrattato.|Forma delle polpette e passale nel pangrattato rimasto.|Cuocile in forno a 200 °C per 20 minuti o in padella con olio 3 minuti per lato.~Si preparano con ingredienti di dispensa: ottime per svuotare la credenza.`,
`Spaghetti alle cozze~pasta~30~Facile~GP~Spaghetti:D:320;Cozze:C:1000;Pomodorini:F:250;Aglio:F:2:spicchi;Prezzemolo:F:1:mazzo~Pulisci le cozze e aprile in una pentola coperta con olio e aglio a fuoco vivo (5 minuti); sgusciane metà e filtra il liquido.|In padella rosola i pomodorini a metà con olio per 5 minuti e aggiungi il liquido delle cozze.|Cuoci gli spaghetti 2 minuti meno del tempo indicato e finisci la cottura in padella.|Unisci le cozze e il prezzemolo e servi.~Un pizzico di peperoncino ci sta benissimo.`,
`Paccheri pesce spada e melanzane~pasta~35~Media~GP~Paccheri:D:320;Pesce spada:C:300;Melanzane:F:1:pz;Pomodorini:F:250;Menta:F:1:mazzo;Aglio:F:1:spicchi~Taglia la melanzana a dadini e friggila o rosolala in abbondante olio finché è dorata; scolala.|In padella rosola aglio e pomodorini 5 minuti, poi aggiungi il pesce spada a dadini e cuoci 3 minuti.|Cuoci i paccheri al dente e saltali nel sugo con le melanzane.|Completa con menta fresca spezzata.~È un piatto siciliano estivo: la menta fa la differenza.`,
`Pesce spada al salmoriglio~pesce~20~Facile~P~Pesce spada:C:700;Limoni:F:2:pz;Origano:D:3;Prezzemolo:F:1:mazzo;Aglio:F:1:spicchi~Prepara il salmoriglio: sbatti olio, succo di limone, un po’ d’acqua calda, origano, prezzemolo e aglio tritati e sale.|Cuoci le fette di pesce spada su piastra ben calda 2-3 minuti per lato.|Irrorale subito con il salmoriglio e servi.~Il salmoriglio è la salsa calabrese e siciliana per tutto il pesce alla griglia.`,
`Passato di verdure con crostini~legumi~40~Facile~G~Patate:F:300;Carote:F:2:pz;Zucchine:F:300;Porri:F:1:pz;Sedano:F:1:pz;Pane:P:4:pz~Taglia tutte le verdure a pezzi.|Mettile in pentola con 1,2 litri d’acqua e un pizzico di sale e cuoci 30 minuti.|Frulla fino a una crema liscia, regolando la densità con l’acqua di cottura.|Servi con crostini tostati, olio a crudo e parmigiano a piacere.~Piace anche ai più piccoli: è la base delle prime pappe.`,
`Crespelle prosciutto e formaggio~pasta~50~Media~GUL~Farina:D:150;Uova:L:3:pz;Latte:L:350:ml;Prosciutto cotto:C:150;Fontina:L:150;Besciamella:L:400:ml;Parmigiano:L:40~Frulla farina, uova, latte e un pizzico di sale e lascia riposare la pastella 20 minuti.|Cuoci le crespelle in una padellina unta, un mestolino alla volta, 1 minuto per lato.|Farcisci ogni crespella con prosciutto, fontina e un cucchiaio di besciamella e piegala in quattro.|Disponile in una pirofila, coprile con la besciamella rimasta e il parmigiano.|Gratina in forno a 200 °C per 15 minuti.~Si possono preparare in anticipo e infornare all’ultimo.`

const avOk=s=>typeof s==='string'&&/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(s);
const av=(p,s)=>avOk(p.av)?`<div class="ph" style="width:${s}px;height:${s}px;border-radius:50%;background:url('${p.av}') center/cover"></div>`:`<div class="ph" style="width:${s}px;height:${s}px;border-radius:50%;background:var(--soft);font-size:${Math.round(s*.5)}px">${p.a<14?'🧒':'🧑'}</div>`;
const avBtn=(p,i,s)=>`<input type="file" id="avf${i}" accept="image/*" style="display:none" onchange="setAv(${i},this.files)"><button aria-label="Cambia foto di ${qa(p.n)}" style="position:relative;flex:none" onclick="document.getElementById('avf${i}').click()">${av(p,s)}<span style="position:absolute;right:-2px;bottom:-2px;background:var(--pine);color:#fff;border-radius:50%;width:20px;height:20px;font-size:11px;display:grid;place-items:center">📷</span></button>`;
async function setAv(i,fl){if(!fl||!fl[0]||!S.m[i])return;try{S.m[i].av=await shrink(fl[0],160,14000)}catch(e){}draw()}
function delAv(i){if(S.m[i])delete S.m[i].av;draw()}
function sdCfg(){return `<h3 style="margin-top:18px">Giorno della spesa</h3><div style="margin-top:8px">${DAYS.map((d,i)=>`<button class="chip ${S.sd===i?'on':''}" onclick="setSd(${i})">${d.slice(0,3)}</button>`).join('')}</div><p class="mut">Il menu parte da quel giorno e la lista è pronta per fare la spesa.</p><div><button class="chip ${S.nt?'on':''}" onclick="S.nt=!S.nt;syncNotif();draw()">🔔 Avviso la mattina</button>${[7,8,9].map(h=>`<button class="chip ${S.nh===h?'on':''}" onclick="S.nh=${h};syncNotif();draw()">${h}:00</button>`).join('')}</div>${LNp()?'':'<p class="mut">Gli avvisi funzionano nell’app Android.</p>'}`}
let py=null,pd=0;
if($.addEventListener){$.addEventListener('touchstart',e=>{const sc=$.querySelector('.scr');py=(S.step===4&&S.tab===0&&!S.sheet&&!S.det&&!S.ospiti&&!S.vv&&!S.pl&&!S.mr&&sc&&sc.scrollTop<=0)?e.touches[0].clientY:null;pd=0},{passive:true});
$.addEventListener('touchmove',e=>{if(py===null)return;pd=e.touches[0].clientY-py;const el=$.querySelector('#ptr');if(el){el.style.height=Math.max(0,Math.min(60,pd/2))+'px';el.textContent=pd>110?'Rilascia per aggiornare':pd>10?'Tira per aggiornare':''}},{passive:true});
$.addEventListener('touchend',()=>{const go=py!==null&&pd>110;py=null;const el=$.querySelector('#ptr');if(el){el.style.height='0';el.textContent=''}if(go){refreshToday();if(typeof vPull==='function')vPull()}})}
if(document.addEventListener)document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ready){daily();draw()}});
const bk=()=>'<button class="pill" onclick="back()">← Indietro</button>';
function back(){const s=S.step;
if(s===1){if(S.one){if(S.add){S.m.pop();S.pi=Math.max(0,S.m.length-1);S.add=0}S.one=0;S.step=4;S.tab=4}else if(S.pi>0){S.pi--;S.step=3}else S.step=0}
else if(s===2||s===3)S.step=s-1;
else if(s===6){S.step=3;S.pi=S.m.length-1}
else if(s===5)S.step=6;
draw(1)}
const canBack=()=>S.step!==4?S.step!==0:!!(S.vs!=null||S.pap||S.sv||S.rf!==null||S.xq||S.det||S.sheet||S.ospiti||S.vv||S.pl||S.mr||S.tab!==0);
function goBack(){if(S.step!==4){back();return}if(S.vs!=null)S.vs=null;else if(S.pap)S.pap=null;else if(S.sv){svEnd();return}else if(S.rf!==null)S.rf=null;else if(S.xq)S.xq=null;else if(S.det)S.det=null;else if(S.sheet)S.sheet=null;else if(S.ed)S.ed=null;else if(S.ospiti||S.vv||S.pl||S.mr){S.ospiti=0;S.vv=0;S.pl=0;S.mr=0}else if(S.tab!==0)S.tab=0;draw(1)}
try{if(typeof history!=='undefined'&&history.pushState&&window.addEventListener){history.replaceState({r:1},'');history.pushState({r:2},'');window.addEventListener('popstate',()=>{if(canBack()){goBack();history.pushState({r:2},'')}})}}catch(e){}
draw();initCloud();initFr();
</script></body></html>
